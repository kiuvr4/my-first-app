          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-pinkbrand-50 text-pinkbrand-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="saveRenameGradeTerm(event, '${termId}')" class="space-y-4">
          <input id="rename-grade-term-input" type="text" value="${escapeHtml(term.name)}" required class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-pinkbrand-600 text-white font-bold text-xs shadow-pink-sm">Simpan</button>
          </div>
        </form>
      `);
    }

    function saveRenameGradeTerm(e, termId) {
      e.preventDefault();
      const val = document.getElementById('rename-grade-term-input').value.trim();
      if (!val) return;
      const term = appState.gradeTerms.find(t => t.id === termId);
      if (term) {
        term.name = val;
        saveState();
        closeModal();
        renderGradesView();
        showToast('Nama semester diperbarui ✧');
      }
    }

    function confirmDeleteGradeTerm(termId) {
      const term = appState.gradeTerms.find(t => t.id === termId);
      if (!term) return;
      openModal(`
        <div class="text-center space-y-3">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Hapus "${escapeHtml(term.name)}"? (｡•́︿•̀｡)</h3>
          <p class="text-xs text-stone-600">Semua nilai di dalam semester ini akan ikut terhapus.</p>
          <div class="flex justify-center gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button onclick="executeDeleteGradeTerm('${termId}')" class="px-5 py-2.5 rounded-2xl bg-rose-600 text-white font-bold text-xs">Ya, Hapus</button>
          </div>
        </div>
      `);
    }

    function executeDeleteGradeTerm(termId) {
      appState.gradeTerms = appState.gradeTerms.filter(t => t.id !== termId);
      appState.grades = appState.grades.filter(g => g.termId !== termId);
      if (gradesViewState.selectedTermId === termId) gradesViewState.selectedTermId = null;
      saveState(true);
      closeModal();
      renderGradesView();
      showToast('Semester dihapus.');
    }

    function openGradeEntryModal(termId, defaultCategory = 'KD', gradeId = null) {
      const existing = gradeId ? appState.grades.find(g => g.id === gradeId) : null;
      const selectedCat = normalizeGradeCategory(existing?.category || defaultCategory);
      const subjectSuggestions = appState.subjects.map(s => s.name);

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display font-extrabold text-lg text-stone-800">${existing ? 'Edit Catatan Nilai' : 'Catat Nilai Baru ₊˚ʚɞ'}</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-pinkbrand-50 text-pinkbrand-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="saveGradeEntry(event, '${termId}', '${existing ? existing.id : ''}')" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">Kategori Nilai</label>
            <div class="grid grid-cols-3 gap-2">
              ${[
                { id: 'KD', label: 'KD' },
                { id: 'UAS', label: 'Ujian Akhir Semester' },
                { id: 'RAPORT', label: 'Nilai Rapor' }
              ].map(opt => `
                <label class="cursor-pointer">
                  <input type="radio" name="grade-category-radio" value="${opt.id}" ${selectedCat === opt.id ? 'checked' : ''} class="peer sr-only">
                  <div class="h-full flex items-center justify-center text-center px-2 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-[11px] sm:text-xs font-extrabold text-stone-700 peer-checked:bg-pinkbrand-600 peer-checked:text-white peer-checked:border-pinkbrand-600 shadow-2xs transition">
                    ${opt.label}
                  </div>
                </label>
              `).join('')}
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="sm:col-span-2">
              <label class="block text-xs font-bold text-stone-700 mb-1">Mata Pelajaran</label>
              <input id="grade-subject-input" list="grade-subjects-list" type="text" value="${existing ? escapeHtml(existing.subjectName) : ''}" placeholder="Contoh: Fisika, Matematika..." required class="w-full px-3.5 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
              <datalist id="grade-subjects-list">
                ${subjectSuggestions.map(name => `<option value="${escapeHtml(name)}">`).join('')}
              </datalist>
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">Nilai / Skor</label>
              <input id="grade-score-input" type="number" step="0.01" min="0" max="1000" value="${existing ? existing.score : ''}" placeholder="92" required class="w-full px-3.5 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-black text-pinkbrand-600 outline-none focus:border-pinkbrand-500">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">Keterangan / Bab KD (Opsional)</label>
              <input id="grade-title-input" type="text" value="${existing ? escapeHtml(existing.title || '') : ''}" placeholder="Contoh: KD 3.1 Hukum Newton" class="w-full px-3.5 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">Tanggal</label>
              <input id="grade-date-input" type="date" value="${existing?.date || getTodayStr()}" class="w-full px-3.5 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-semibold text-stone-800">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">Evaluasi / Catatan Singkat (Opsional)</label>
            <input id="grade-note-input" type="text" value="${existing ? escapeHtml(existing.note || '') : ''}" placeholder="Contoh: Perlu latihan soal cerita lebih banyak..." class="w-full px-3.5 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-medium text-stone-800 outline-none focus:border-pinkbrand-500">
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-pinkbrand-600 text-white font-bold text-xs shadow-pink-sm">Simpan Nilai</button>
          </div>
        </form>
      `);
      setTimeout(() => document.getElementById('grade-subject-input')?.focus(), 50);
    }

    function saveGradeEntry(e, termId, gradeId) {
      e.preventDefault();
      const selectedRadio = document.querySelector('input[name="grade-category-radio"]:checked');
      const entryData = {
        termId,
        category: selectedRadio ? selectedRadio.value : 'KD',
        subjectName: document.getElementById('grade-subject-input').value.trim(),
        score: parseFloat(document.getElementById('grade-score-input').value),
        title: document.getElementById('grade-title-input').value.trim(),
        date: document.getElementById('grade-date-input').value,
        note: document.getElementById('grade-note-input').value.trim()
      };
      if (!entryData.subjectName || isNaN(entryData.score)) return;

      if (gradeId) {
        const idx = appState.grades.findIndex(g => g.id === gradeId);
        if (idx !== -1) appState.grades[idx] = { ...appState.grades[idx], ...entryData };
      } else {
        appState.grades.unshift({ id: 'grd_' + Date.now(), ...entryData });
      }
      saveState(true);
      closeModal();
      renderGradesView();
      showToast('Nilai berhasil disimpan ✧');
    }

    function deleteGradeEntry(gradeId) {
      appState.grades = appState.grades.filter(g => g.id !== gradeId);
      saveState(true);
      renderGradesView();
      showToast('Catatan nilai dihapus.');
    }

    /*************************************************************************
     * 2. STUDY TIMER VIEW (STOPWATCH & RESET BELAJAR MANUAL)
     *************************************************************************/
    function renderTimerView() {
      const main = document.getElementById('app-content');
      const at = appState.activeTimer;
      const activeSubj = appState.subjects.find(s => s.id === at.subjectId);
      const mainSeconds = timerMainMode === 'cycle' ? getTotalCycleSeconds() : getTotalAllTimeSeconds();
      const totalCycleSec = getTotalCycleSeconds();

      main.innerHTML = `
        <div class="space-y-5">
          <section class="relative overflow-hidden bg-white rounded-3xl p-6 border-2 ${at.isRunning ? 'border-pinkbrand-500 shadow-pink-md' : 'border-pinkbrand-200 shadow-pink-sm'} text-center">
            <div class="flex items-center justify-center gap-2 mb-2">
              <button onclick="setMainTimerMode('cycle')" class="px-3 py-1 rounded-full text-xs font-bold transition ${timerMainMode === 'cycle' ? 'bg-pinkbrand-600 text-white' : 'bg-pinkbrand-50 text-pinkbrand-600'}">
                Sesi Belajar Aktif
              </button>
              <button onclick="setMainTimerMode('all')" class="px-3 py-1 rounded-full text-xs font-bold transition ${timerMainMode === 'all' ? 'bg-pinkbrand-600 text-white' : 'bg-pinkbrand-50 text-pinkbrand-600'}">
                Semua Waktu
              </button>
            </div>

            <div id="main-stopwatch-display" data-mode="${timerMainMode}" class="font-display font-black text-5xl sm:text-6xl tracking-tight text-stone-800 my-3 select-none">
              ${formatHMS(mainSeconds)}
            </div>

            <div class="min-h-[26px] flex items-center justify-center mb-4">
              ${activeSubj ? `
                <span class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-pinkbrand-100 text-pinkbrand-600 text-xs font-extrabold">
                  <span class="w-2.5 h-2.5 rounded-full ${at.isRunning ? 'bg-pinkbrand-600 animate-ping' : 'bg-pinkbrand-400'}"></span>
                  ${at.isRunning ? 'Sedang belajar:' : 'Dijeda:'} ${escapeHtml(activeSubj.name)} (${formatHMS(getCurrentActiveElapsedSec())})
                </span>
              ` : `
                <span class="text-xs font-semibold text-stone-500">
                  Pilih mata pelajaran di bawah atau tekan Mulai ⋆˚꩜｡
                </span>
              `}
            </div>

            <div class="flex flex-wrap items-center justify-center gap-2.5">
              ${!at.isRunning ? `
                <button onclick="handleMainStartClick()" class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-pinkbrand-600 hover:bg-pinkbrand-500 text-white font-extrabold text-sm shadow-pink-md transition active:scale-95">
                  <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                  <span>${at.subjectId ? 'Lanjutkan' : 'Mulai Belajar'}</span>
                </button>
              ` : `
                <button onclick="pauseActiveTimer()" class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-sm shadow-sm transition active:scale-95">
                  <i data-lucide="pause" class="w-4 h-4 fill-current"></i>
                  <span>Jeda</span>
                </button>
              `}

              <button onclick="confirmResetStudyCycle()" class="inline-flex items-center gap-2 px-5 py-3 rounded-2xl ${totalCycleSec > 0 ? 'bg-pinkbrand-100 hover:bg-pinkbrand-200 text-pinkbrand-600 border border-pinkbrand-300' : 'bg-pinkbrand-50 text-pinkbrand-400 border border-pinkbrand-200'} font-extrabold text-sm transition active:scale-95">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>Reset Belajar</span>
              </button>
            </div>
          </section>

          <section class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="font-display font-extrabold text-lg text-stone-800">Timer Mata Pelajaran</h3>
                <p class="text-xs text-stone-500">Waktu bertahan hingga kamu menekan tombol Reset Belajar</p>
              </div>
              <button onclick="openAddSubjectModal()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-2xl bg-pinkbrand-600 hover:bg-pinkbrand-500 text-white text-xs font-bold shadow-pink-sm transition active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Mapel Baru</span>
              </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${appState.subjects.map(subj => {
                const isThisSelected = at.subjectId === subj.id;
                const isThisRunning = isThisSelected && at.isRunning;
                const cycleSubjSec = getCycleSecondsForSubject(subj.id);
                const totalAllSubj = getRecordedSecondsBySubject(subj.id) + cycleSubjSec;

                return `
                  <div class="p-4 rounded-2xl border-2 transition-all ${isThisRunning ? 'bg-pinkbrand-50 border-pinkbrand-600 shadow-pink-sm' : (isThisSelected ? 'bg-pinkbrand-50/60 border-pinkbrand-400' : 'bg-pinkbrand-50/30 border-pinkbrand-200')}">
                    <div class="flex items-start justify-between gap-2">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white shrink-0 shadow-xs" style="background:${subj.color || '#B66878'}">
                          <i data-lucide="${subj.icon || 'book-open'}" class="w-4 h-4"></i>
                        </div>
                        <div class="min-w-0">
                          <h4 class="font-display font-extrabold text-sm text-stone-800 truncate">${escapeHtml(subj.name)}</h4>
                          <p class="text-[11px] text-stone-500 font-medium">
                            Total Riwayat: ${formatHumanDuration(totalAllSubj)}
                          </p>
                        </div>
                      </div>

                      <div class="flex items-center gap-1 shrink-0">
                        <button onclick="openRenameSubjectModal('${subj.id}')" class="p-1.5 rounded-lg text-stone-400 hover:text-pinkbrand-600 hover:bg-pinkbrand-100 transition" title="Ubah nama">
                          <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="confirmDeleteSubject('${subj.id}')" class="p-1.5 rounded-lg text-stone-400 hover:text-rose-600 hover:bg-rose-50 transition" title="Hapus">
                          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>

                    <div class="mt-3 pt-3 border-t border-pinkbrand-100 flex items-center justify-between">
                      <div>
                        <span class="text-[10px] uppercase font-bold text-stone-500 block">Durasi Aktif</span>
                        <span id="subj-timer-${subj.id}" class="font-display font-black text-xl text-stone-800">
                          ${formatHMS(cycleSubjSec)}
                        </span>
                      </div>

                      ${isThisRunning ? `
                        <button onclick="pauseActiveTimer()" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs transition active:scale-95">
                          <i data-lucide="pause" class="w-3.5 h-3.5 fill-current"></i> Jeda
                        </button>
                      ` : `
                        <button onclick="startOrResumeSubjectTimer('${subj.id}')" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-pinkbrand-600 hover:bg-pinkbrand-500 text-white font-extrabold text-xs shadow-pink-sm transition active:scale-95">
                          <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Mulai
                        </button>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <section class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-display font-extrabold text-base text-stone-800 flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4 text-pinkbrand-600"></i>
                Riwayat Sesi Belajar (${appState.sessions.length})
              </h3>
              <span class="text-xs font-semibold text-stone-500">Tercatat saat Reset Belajar</span>
            </div>

            ${appState.sessions.length === 0 ? `
              <div class="py-8 text-center bg-pinkbrand-50/60 rounded-2xl border border-dashed border-pinkbrand-200 px-4">
                <p class="text-sm font-bold text-stone-600">Belum ada riwayat sesi tercatat ⋆˚꩜｡</p>
                <p class="text-xs text-stone-500 mt-1">Tekan tombol "Reset Belajar" di timer utama untuk mencatat sesi ke riwayat!</p>
              </div>
            ` : `
              <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                ${appState.sessions.slice(0, 40).map(sess => {
                  const dayLabel = sess.dayName || (sess.date ? HARI_ID[parseLocalDate(sess.date).getDay()] : '');
                  return `
                    <div class="flex items-center justify-between gap-3 p-3 rounded-2xl bg-pinkbrand-50/50 border border-pinkbrand-100">
                      <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="font-bold text-sm text-stone-800 truncate">${escapeHtml(sess.subjectName)}</span>
                          <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-pinkbrand-100 text-pinkbrand-600">
                            ${formatHMS(sess.durationSec)}
                          </span>
                        </div>
                        <p class="text-[11px] text-stone-500 mt-0.5">
                          ${dayLabel ? dayLabel + ', ' : ''}${formatDateIndo(sess.date, false)} • ${sess.startTime} - ${sess.endTime}
                        </p>
                      </div>
                      <button onclick="deleteSessionRecord('${sess.id}')" class="p-1.5 rounded-xl text-stone-400 hover:text-rose-600 hover:bg-rose-50 transition" title="Hapus">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>
        </div>
      `;
      safeRefreshIcons(main);
    }

    function setMainTimerMode(mode) {
      timerMainMode = mode;
      renderTimerView();
    }

    function handleMainStartClick() {
      if (appState.activeTimer.subjectId) {
        startOrResumeSubjectTimer(appState.activeTimer.subjectId);
      } else if (appState.subjects.length > 0) {
        startOrResumeSubjectTimer(appState.subjects[0].id);
      } else {
        openAddSubjectModal();
      }
    }

    function deleteSessionRecord(sessId) {
      appState.sessions = appState.sessions.filter(s => s.id !== sessId);
      saveState();
      renderTimerView();
      showToast('Riwayat sesi dihapus.');
    }

    function openAddSubjectModal() {
      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Tambah Mata Pelajaran Baru ✎</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-pinkbrand-50 text-pinkbrand-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="createNewSubject(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">Nama Mata Pelajaran</label>
            <input id="new-subj-name" type="text" placeholder="Contoh: Bahasa Inggris, Ekonomi..." required class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">Pilih Warna Rose</label>
            <div class="flex gap-2">
              ${['#B66878', '#C98895', '#D49BA7', '#DAABB5'].map((col, idx) => `
                <label class="cursor-pointer">
                  <input type="radio" name="subj-color" value="${col}" ${idx === 0 ? 'checked' : ''} class="peer sr-only">
                  <span class="block w-8 h-8 rounded-full border-2 border-white ring-2 ring-transparent peer-checked:ring-stone-800 transition" style="background:${col}"></span>
                </label>
              `).join('')}
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-pinkbrand-600 text-white font-bold text-xs shadow-pink-sm">Simpan</button>
          </div>
        </form>
      `);
      setTimeout(() => document.getElementById('new-subj-name')?.focus(), 50);
    }

    function createNewSubject(e) {
      e.preventDefault();
      const name = document.getElementById('new-subj-name').value.trim();
      const color = document.querySelector('input[name="subj-color"]:checked')?.value || '#B66878';
      if (!name) return;
      appState.subjects.push({ id: 'subj_' + Date.now(), name, color, icon: 'book-open' });
      saveState();
      closeModal();
      if (currentTab === 'timer') renderTimerView();
      if (currentTab === 'catatan') renderNotesView();
      showToast(`Mata pelajaran "${name}" berhasil ditambahkan ₊˚ʚɞ`);
    }

    function openRenameSubjectModal(subjId) {
      const subj = appState.subjects.find(s => s.id === subjId);
      if (!subj) return;
      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Ubah Nama Mata Pelajaran</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-pinkbrand-50 text-pinkbrand-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="saveRenameSubject(event, '${subjId}')" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">Nama Baru</label>
            <input id="rename-subj-input" type="text" value="${escapeHtml(subj.name)}" required class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-pinkbrand-600 text-white font-bold text-xs shadow-pink-sm">Simpan</button>
          </div>
        </form>
      `);
    }

    function saveRenameSubject(e, subjId) {
      e.preventDefault();
      const newName = document.getElementById('rename-subj-input').value.trim();
      if (!newName) return;
      const subj = appState.subjects.find(s => s.id === subjId);
      if (subj) {
        subj.name = newName;
        appState.sessions.forEach(s => { if (s.subjectId === subjId) s.subjectName = newName; });
        saveState();
        closeModal();
        if (currentTab === 'timer') renderTimerView();
        if (currentTab === 'catatan') renderNotesView();
        showToast('Nama mata pelajaran diperbarui ✧');
      }
    }

    function confirmDeleteSubject(subjId) {
      const subj = appState.subjects.find(s => s.id === subjId);
      if (!subj) return;
      openModal(`
        <div class="text-center space-y-3">

    function executeDeleteSubject(subjId) {
      if (appState.activeTimer.subjectId === subjId) commitCurrentTimerSession(false);
      appState.subjects = appState.subjects.filter(s => s.id !== subjId);

      if (notesViewState.selectedSubjectId === subjId) {
        notesViewState.selectedSubjectId = null;
        notesViewState.selectedTopicId = null;
      }
      saveState();
      closeModal();
      if (currentTab === 'timer') renderTimerView();
      if (currentTab === 'catatan') renderNotesView();
      showToast('Mata pelajaran dihapus.');

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">

                  <div onclick="openNoteSubject('${subj.id}')" class="bg-white rounded-3xl p-5 border border-pinkbrand-200 hover:border-pinkbrand-500 shadow-pink-sm cursor-pointer transition group flex flex-col justify-between">

    function openNoteSubject(subjId) {
      notesViewState.selectedSubjectId = subjId;
      notesViewState.selectedTopicId = null;
      renderNotesView();
    }

    function backToAllSubjects() {
      notesViewState.selectedSubjectId = null;
      notesViewState.selectedTopicId = null;
      renderNotesView();
    }

    function updateNotesSearch(val) {
      notesViewState.searchQuery = val;
      renderNotesView();
    }

    function stripHtml(html) {
      if (!html) return '';
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }

    function openAddTopicModal(subjectId) {
      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Tambahkan Materi Baru ⋆˚꩜｡</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-pinkbrand-50 text-pinkbrand-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="createNewTopic(event, '${subjectId}')" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">Judul Materi / Bab</label>
            <input id="new-topic-title" type="text" placeholder="Contoh: Hukum Newton, Aljabar..." required class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-pinkbrand-600 text-white font-bold text-xs shadow-pink-sm">Buat & Buka</button>
          </div>
        </form>
      `);
      setTimeout(() => document.getElementById('new-topic-title')?.focus(), 50);
    }

    function createNewTopic(e, subjectId) {
      e.preventDefault();
      const title = document.getElementById('new-topic-title').value.trim();
      if (!title) return;
      const newTopic = { id: 'top_' + Date.now(), subjectId, title, contentHtml: '', updatedAt: getTodayStr() };
      appState.topics.unshift(newTopic);
      scheduleSpacedRepetitionForTopic(newTopic, false);
      saveState(true);
      closeModal();
      notesViewState.selectedSubjectId = subjectId;
      notesViewState.selectedTopicId = newTopic.id;
      renderNotesView();
      showToast('Materi baru siap ditulis & pengingat review otomatis aktif! 🔔');
    }

    function scheduleReviewFromCurrentTopic() {
      const topic = appState.topics.find(t => t.id === notesViewState.selectedTopicId);
      if (topic) {
        scheduleSpacedRepetitionForTopic(topic, true);
      }
    }

    function openTopicEditor(topicId) {
      const topic = appState.topics.find(t => t.id === topicId);
      if (!topic) return;
      notesViewState.selectedSubjectId = topic.subjectId;
      notesViewState.selectedTopicId = topic.id;
      renderNotesView();
    }

    function exitTopicEditor() {
      notesViewState.selectedTopicId = null;
      renderNotesView();
    }

    function openRenameTopicModal(topicId) {
      const topic = appState.topics.find(t => t.id === topicId);
      if (!topic) return;
      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Ubah Judul Materi</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-pinkbrand-50 text-pinkbrand-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="saveRenameTopic(event, '${topicId}')" class="space-y-4">
          <input id="rename-topic-input" type="text" value="${escapeHtml(topic.title)}" required class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-pinkbrand-600 text-white font-bold text-xs shadow-pink-sm">Simpan</button>
          </div>
        </form>
      `);
    }

    function saveRenameTopic(e, topicId) {
      e.preventDefault();
      const val = document.getElementById('rename-topic-input').value.trim();
      if (!val) return;
      const topic = appState.topics.find(t => t.id === topicId);
      if (topic) {
        topic.title = val;
        topic.updatedAt = getTodayStr();
        saveState();
        closeModal();
        renderNotesView();
        showToast('Judul materi diperbarui ✧');
      }
    }

    function confirmDeleteTopic(topicId) {
      const topic = appState.topics.find(t => t.id === topicId);
      if (!topic) return;
      openModal(`
        <div class="text-center space-y-3">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Hapus Materi "${escapeHtml(topic.title)}"? (｡•́︿•̀｡)</h3>
          <p class="text-xs text-stone-600">Catatan di dalam materi ini akan dihapus permanen.</p>
          <div class="flex justify-center gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button onclick="executeDeleteTopic('${topicId}')" class="px-5 py-2.5 rounded-2xl bg-rose-600 text-white font-bold text-xs">Hapus</button>
          </div>
        </div>
      `);
    }

    function executeDeleteTopic(topicId) {
      appState.topics = appState.topics.filter(t => t.id !== topicId);
      saveState();
      closeModal();
      renderNotesView();
      showToast('Materi dihapus.');
    }

    function handleTopicTitleChange(newTitle) {
      const topic = appState.topics.find(t => t.id === notesViewState.selectedTopicId);
      if (topic) {
        topic.title = newTitle || 'Tanpa Judul';
        topic.updatedAt = getTodayStr();
        saveState();
      }
    }

    function handleNoteContentChange() {
      const editor = document.getElementById('note-editor');
      const topic = appState.topics.find(t => t.id === notesViewState.selectedTopicId);
      if (editor && topic) {
        topic.contentHtml = editor.innerHTML;
        topic.updatedAt = getTodayStr();
        saveState();
        const badge = document.getElementById('note-autosave-badge');
        if (badge) {
          badge.textContent = 'Menyinkronkan...';
          clearTimeout(window._saveBadgeTimer);

    function applyPinkHighlight() {
      const editor = document.getElementById('note-editor');
      if (!editor) return;
      editor.focus();
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        const span = document.createElement('span');
        span.className = 'pink-highlight';
        span.textContent = sel.toString();
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(span);
        handleNoteContentChange();
      } else {
        document.execCommand('foreColor', false, '#B66878');
        handleNoteContentChange();

    function handleNoteImageSelected(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_DIM = 820;
          let w = img.width;
          let h = img.height;
          if (w > MAX_DIM || h > MAX_DIM) {
            if (w > h) {
              h = Math.round((h * MAX_DIM) / w);
              w = MAX_DIM;
            } else {
              w = Math.round((w * MAX_DIM) / h);
              h = MAX_DIM;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.78);

          const imgHtml = `<img src="${compressedDataUrl}" alt="Gambar Catatan"><p><br></p>`;
          const editor = document.getElementById('note-editor');
          if (editor) {
            editor.focus();
            document.execCommand('insertHTML', false, imgHtml);
            handleNoteContentChange();
            showToast('Gambar berhasil dioptimalkan & disimpan ⋆˚꩜｡');
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function navigateCalendar(dir) {
      const d = parseLocalDate(calendarViewState.cursorDate);
      if (calendarViewState.mode === 'month') d.setMonth(d.getMonth() + dir);
      else if (calendarViewState.mode === 'week') d.setDate(d.getDate() + dir * 7);
      else d.setDate(d.getDate() + dir);
      calendarViewState.cursorDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      renderCalendarView();
    }

    /*************************************************************************
     * 5. STUDY GOALS (TARGET BELAJAR)
     *************************************************************************/
    function calculateStudyStreak() {
      const datesWithStudy = new Set(appState.sessions.filter(s => s.durationSec > 0).map(s => s.date));
      if (getCurrentActiveElapsedSec() > 0) datesWithStudy.add(getTodayStr());
      if (datesWithStudy.size === 0) return 0;

      let streak = 0;
      const d = parseLocalDate(getTodayStr());
      if (!datesWithStudy.has(getTodayStr())) d.setDate(d.getDate() - 1);
      while (true) {
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (datesWithStudy.has(key)) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function openGoalsModal() {
      const todayStr = getTodayStr();
      const todaySec = getTotalTodaySeconds();
      const weekDates = getWeekBounds(todayStr);
      const weekSec = appState.sessions.filter(s => weekDates.includes(s.date)).reduce((a, b) => a + b.durationSec, 0) + getCurrentActiveElapsedSec();
      const monthPrefix = todayStr.slice(0, 7);
      const monthSec = appState.sessions.filter(s => s.date.startsWith(monthPrefix)).reduce((a, b) => a + b.durationSec, 0) + getCurrentActiveElapsedSec();

      const dTarget = (appState.goals.dailyMinutes || 120) * 60;
      const wTarget = (appState.goals.weeklyMinutes || 840) * 60;
      const mTarget = (appState.goals.monthlyMinutes || 3600) * 60;

      const dPct = Math.min(100, Math.round((todaySec / dTarget) * 100));
      const wPct = Math.min(100, Math.round((weekSec / wTarget) * 100));
      const mPct = Math.min(100, Math.round((monthSec / mTarget) * 100));
      const streak = calculateStudyStreak();

      const last7Days = [];
      for (let i = 0; i < 7; i++) {
        const dt = parseLocalDate(todayStr);
        dt.setDate(dt.getDate() - i);
        const k = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        const sec = k === todayStr ? todaySec : getRecordedSecondsByDate(k);
        last7Days.push({ date: k, sec, met: sec >= dTarget && dTarget > 0 });
      }

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-xl bg-pinkbrand-100 text-pinkbrand-600 flex items-center justify-center"><i data-lucide="target" class="w-4 h-4"></i></span>
            <h3 class="font-display font-extrabold text-lg text-stone-800">Target Belajar & Streak</h3>
          </div>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-pinkbrand-50 text-pinkbrand-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="p-4 rounded-2xl bg-gradient-to-r from-pinkbrand-600 to-pinkbrand-500 text-white mb-4 flex items-center justify-between shadow-pink-sm">
          <div>
            <span class="text-[11px] font-extrabold uppercase tracking-wider opacity-90">Study Streak Aktif</span>
            <div class="font-display font-black text-2xl mt-0.5">✦ ${streak} Hari Berturut-turut</div>
          </div>
          <span class="text-xs font-bold bg-white/20 px-3 py-1.5 rounded-xl">Konsisten ⋆˚꩜｡</span>
        </div>

        <div class="space-y-3 mb-5">
          ${[
            { label: 'Target Harian', cur: todaySec, tar: dTarget, pct: dPct },
            { label: 'Target Mingguan', cur: weekSec, tar: wTarget, pct: wPct },
            { label: 'Target Bulanan', cur: monthSec, tar: mTarget, pct: mPct }
          ].map(g => `
            <div class="p-3.5 rounded-2xl bg-pinkbrand-50/70 border border-pinkbrand-200">
              <div class="flex justify-between text-xs font-bold mb-1">
                <span class="text-stone-800">${g.label}</span>
                <span class="text-pinkbrand-600">${formatHumanDuration(g.cur)} / ${formatHumanDuration(g.tar)} (${g.pct}%)</span>
              </div>
              <div class="w-full h-2.5 rounded-full bg-pinkbrand-200/60 overflow-hidden">
                <div class="h-full rounded-full bg-pinkbrand-600 transition-all" style="width:${g.pct}%"></div>
              </div>
            </div>
          `).join('')}
        </div>

        <form onsubmit="saveStudyGoals(event)" class="p-4 rounded-2xl bg-white border border-pinkbrand-200 space-y-3 mb-4">
          <h4 class="text-xs font-extrabold uppercase tracking-wider text-pinkbrand-600">Ubah Target Durasi (Menit)</h4>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-stone-700 mb-1">Harian</label>
              <input id="goal-daily-min" type="number" min="10" max="1440" value="${appState.goals.dailyMinutes}" required class="w-full px-3 py-2 rounded-xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-bold text-stone-800">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-stone-700 mb-1">Mingguan</label>
              <input id="goal-weekly-min" type="number" min="30" max="10080" value="${appState.goals.weeklyMinutes}" required class="w-full px-3 py-2 rounded-xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-bold text-stone-800">
            </div>
            <div>

              <input id="goal-monthly-min" type="number" min="60" max="44640" value="${appState.goals.monthlyMinutes}" required class="w-full px-3 py-2 rounded-xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-bold text-stone-800">

          <button type="submit" class="w-full py-2.5 rounded-xl bg-pinkbrand-600 hover:bg-pinkbrand-500 text-white font-bold text-xs shadow-pink-sm transition">
            Simpan Target
          </button>

        <div>

          <div class="grid grid-cols-7 gap-1.5 text-center">
            ${last7Days.reverse().map(item => {
              const dObj = parseLocalDate(item.date);
              return `
                <div class="p-2 rounded-xl border ${item.met ? 'bg-pinkbrand-600 text-white border-pinkbrand-600' : 'bg-pinkbrand-50/50 text-stone-700 border-pinkbrand-200'}">

    }

    /*************************************************************************
     * 6. WEEKLY STUDY STATISTICS (STATISTIK + LEARNING EVALUATOR)
     *************************************************************************/
    function renderStatsView() {
      const main = document.getElementById('app-content');
      const todayStr = getTodayStr();
      const weekDates = getWeekBounds(todayStr);
      const prevRef = parseLocalDate(weekDates[0]);
      prevRef.setDate(prevRef.getDate() - 7);
      const prevWeekDates = getWeekBounds(`${prevRef.getFullYear()}-${String(prevRef.getMonth() + 1).padStart(2, '0')}-${String(prevRef.getDate()).padStart(2, '0')}`);

      const thisWeekSessions = appState.sessions.filter(s => weekDates.includes(s.date));
      const prevWeekSessions = appState.sessions.filter(s => prevWeekDates.includes(s.date));

      const dailyTotals = weekDates.map(d => {
        const base = thisWeekSessions.filter(s => s.date === d).reduce((a, b) => a + b.durationSec, 0);
        return d === todayStr ? base + getCurrentActiveElapsedSec() : base;
      });

      const totalThisWeekSec = dailyTotals.reduce((a, b) => a + b, 0);
      const totalPrevWeekSec = prevWeekSessions.reduce((a, b) => a + b.durationSec, 0);
      const avgDailySec = Math.round(totalThisWeekSec / 7);

      let maxDayIdx = 0;
      dailyTotals.forEach((val, idx) => { if (val > dailyTotals[maxDayIdx]) maxDayIdx = idx; });
      const mostProductiveLabel = dailyTotals[maxDayIdx] > 0 ? `${HARI_ID[parseLocalDate(weekDates[maxDayIdx]).getDay()]} (${formatHumanDuration(dailyTotals[maxDayIdx])})` : 'Belum ada data';

      let comparisonText = 'Belum ada data minggu lalu';
      if (totalPrevWeekSec > 0) {
        const diffPct = Math.round(((totalThisWeekSec - totalPrevWeekSec) / totalPrevWeekSec) * 100);
        comparisonText = diffPct >= 0 ? `+${diffPct}% dari minggu lalu ✧` : `${diffPct}% dari minggu lalu`;
      } else if (totalThisWeekSec > 0) {
        comparisonText = '100% baru minggu ini ⋆˚꩜｡';
      }

      const subjectStats = appState.subjects.map(subj => {
        const base = thisWeekSessions.filter(s => s.subjectId === subj.id).reduce((a, b) => a + b.durationSec, 0);
        const live = (appState.activeTimer.subjectId === subj.id) ? getCurrentActiveElapsedSec() : 0;
        return { ...subj, sec: base + live };
      }).sort((a, b) => b.sec - a.sec);

      const maxBarSec = Math.max(...dailyTotals, 60);

      main.innerHTML = `
        <div class="space-y-5">
          <section class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 class="font-display font-black text-xl sm:text-2xl text-stone-800">Statistik Belajar Mingguan ✿</h2>
              <p class="text-xs text-stone-500 mt-0.5">
                Periode ${formatDateIndo(weekDates[0], false)} – ${formatDateIndo(weekDates[6], false)} ⋆˚꩜｡
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="openReflectionFormModal()" class="inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl bg-pinkbrand-50 hover:bg-pinkbrand-100 text-pinkbrand-600 border border-pinkbrand-200 text-xs font-extrabold transition">
                <i data-lucide="pen-line" class="w-4 h-4"></i>
                <span>Catat Refleksi</span>
              </button>
              <button onclick="openLearningEvaluatorModal()" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-gradient-to-r from-pinkbrand-600 to-pinkbrand-500 text-white text-xs font-extrabold shadow-pink-sm transition active:scale-95">
                <i data-lucide="brain-circuit" class="w-4 h-4"></i>
                <span>Buka Learning Evaluator</span>
              </button>
            </div>
          </section>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="bg-white rounded-3xl p-4 border border-pinkbrand-200 shadow-pink-sm">
              <span class="text-[11px] font-bold text-pinkbrand-600 uppercase">Total Minggu Ini</span>
              <div class="font-display font-black text-xl sm:text-2xl text-stone-800 mt-1">${formatHumanDuration(totalThisWeekSec)}</div>
              <p class="text-[11px] text-stone-500 mt-1">${comparisonText}</p>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-pinkbrand-200 shadow-pink-sm">
              <span class="text-[11px] font-bold text-pinkbrand-600 uppercase">Rata-Rata Harian</span>
              <div class="font-display font-black text-xl sm:text-2xl text-stone-800 mt-1">${formatHumanDuration(avgDailySec)}</div>
              <p class="text-[11px] text-stone-500 mt-1">Per hari (Senin–Minggu)</p>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-pinkbrand-200 shadow-pink-sm">
              <span class="text-[11px] font-bold text-pinkbrand-600 uppercase">Hari Terproduktif</span>
              <div class="font-display font-extrabold text-base sm:text-lg text-stone-800 mt-1 leading-snug">${mostProductiveLabel}</div>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-pinkbrand-200 shadow-pink-sm">
              <span class="text-[11px] font-bold text-pinkbrand-600 uppercase">Sesi Selesai</span>
              <div class="font-display font-black text-xl sm:text-2xl text-stone-800 mt-1">${thisWeekSessions.length} Sesi</div>
              <p class="text-[11px] text-stone-500 mt-1">Tercatat minggu ini</p>
            </div>
          </div>

          <section class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm">
            <h3 class="font-display font-extrabold text-base text-stone-800 mb-4">Durasi Belajar per Hari</h3>
            ${totalThisWeekSec === 0 ? `
              <div class="py-10 text-center bg-pinkbrand-50/60 rounded-2xl border border-dashed border-pinkbrand-200">
                <p class="text-xs font-bold text-stone-500">Belum ada data belajar minggu ini ⋆˚꩜｡</p>
              </div>
            ` : `
              <div class="grid grid-cols-7 gap-2 sm:gap-4 items-end h-48 pt-6 px-2 bg-pinkbrand-50/40 rounded-2xl border border-pinkbrand-200">
                ${weekDates.map((dStr, idx) => {
                  const sec = dailyTotals[idx];
                  const heightPct = sec > 0 ? Math.max(8, Math.round((sec / maxBarSec) * 100)) : 3;
                  const dayLabel = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'][idx];
                  const isToday = dStr === todayStr;
                  return `
                    <div class="flex flex-col items-center justify-end h-full">
                      <span class="text-[10px] font-extrabold text-pinkbrand-600 mb-1">${sec > 0 ? Math.round(sec / 60) + 'm' : ''}</span>
                      <div class="w-full max-w-[36px] rounded-t-xl transition-all duration-500 ${sec > 0 ? 'bg-gradient-to-t from-pinkbrand-600 to-pinkbrand-400 shadow-pink-sm' : 'bg-pinkbrand-200/50'}" style="height:${heightPct}%"></div>
                      <span class="text-xs font-extrabold mt-2 pb-2 ${isToday ? 'text-pinkbrand-600 underline' : 'text-stone-600'}">${dayLabel}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>

          <section class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm">
            <h3 class="font-display font-extrabold text-base text-stone-800 mb-4">Distribusi per Mata Pelajaran</h3>
            <div class="space-y-3">
              ${subjectStats.map(s => {
                const pct = totalThisWeekSec > 0 ? Math.round((s.sec / totalThisWeekSec) * 100) : 0;
                return `
                  <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                      <span class="text-stone-800">${escapeHtml(s.name)}</span>
                      <span class="text-pinkbrand-600">${formatHumanDuration(s.sec)} (${pct}%)</span>
                    </div>
                    <div class="w-full h-3 rounded-full bg-pinkbrand-50 overflow-hidden border border-pinkbrand-200">
                      <div class="h-full rounded-full transition-all duration-500" style="width:${pct}%; background:${s.color || '#B66878'}"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
      safeRefreshIcons(main);
    }

              </button>

    function generateCompactDataCode() {
      try {
        const jsonStr = JSON.stringify(appState);
        const utf8Bytes = new TextEncoder().encode(jsonStr);
        let binary = '';
        for (let i = 0; i < utf8Bytes.length; i++) {
          binary += String.fromCharCode(utf8Bytes[i]);
        }
        return 'MSS1:' + btoa(binary);
      } catch (e) {
        return JSON.stringify(appState);
      }
    }

    function decodeCompactDataCode(rawInput) {
      const trimmed = (rawInput || '').trim();
      if (!trimmed) throw new Error('Kode kosong');
      if (trimmed.startsWith('MSS1:')) {
        const b64 = trimmed.slice(5).trim();
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const jsonStr = new TextDecoder().decode(bytes);
        return JSON.parse(jsonStr);
      }
      return JSON.parse(trimmed);
    }

    function copyCompactDataCode() {
      const box = document.getElementById('data-code-box');
      const codeStr = box ? box.value : generateCompactDataCode();
      try {
        if (box) {
          box.focus();
          box.select();
          box.setSelectionRange(0, codeStr.length);
        }
        const ok = document.execCommand('copy');
        if (ok) {
          showToast('Kode data berhasil disalin! Simpan di catatan HP kamu ya ₊˚ʚɞ');
          return;
        }
      } catch (e) {}

      const temp = document.createElement('textarea');
      temp.value = codeStr;
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand('copy');
        showToast('Kode data berhasil disalin! Simpan di catatan HP kamu ya ₊˚ʚɞ');
      } catch (err) {
        showToast('Tahan kotak kode di atas lalu pilih Salin Semua.', 'error');
      }
      document.body.removeChild(temp);
    }

    function openPasteDataCodeModal() {
      openModal(`
        <div class="flex items-center justify-between mb-4">

            <label class="block text-xs font-bold text-stone-700 mb-1.5">Tempel (Paste) Kode Data cadanganmu di sini:</label>
            <textarea id="paste-data-code-input" rows="5" placeholder="Tempel kode yang diawali MSS1:... atau JSON di sini" required class="w-full px-3.5 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 font-mono text-xs text-stone-800 outline-none focus:border-pinkbrand-500"></textarea>

      setTimeout(() => document.getElementById('paste-data-code-input')?.focus(), 50);
    }

    function applyPastedDataCode(e) {
      e.preventDefault();
      const raw = document.getElementById('paste-data-code-input')?.value || '';
      try {
        const parsed = decodeCompactDataCode(raw);
        if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.subjects)) {
          throw new Error('Format kode tidak valid');
        }
        appState = mergeWithDefaults(parsed);
        saveState(true);
        closeModal();
        switchTab('beranda');
        showToast('Seluruh data berhasil dipulihkan dari kode teks! ⋆˚꩜｡');
      } catch (err) {
        showToast('Kode data tidak valid atau terpotong. Pastikan semua karakter tersalin utuh (｡•́︿•̀｡)', 'error');
      }
    }

    function saveProfileSettings(e) {
      e.preventDefault();
      appState.profile.name = document.getElementById('set-profile-name').value.trim() || 'Sahabat Belajar';
      appState.profile.snbtDate = document.getElementById('set-snbt-date').value || '2028-04-20';

    function downloadJsonBackup() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `my-study-space-backup-${getTodayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON berhasil diunduh ✧');
    }

    function restoreJsonBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (!parsed || !Array.isArray(parsed.subjects)) throw new Error();
          appState = mergeWithDefaults(parsed);
          saveState(true);
          closeModal();
          switchTab('beranda');
          showToast('Data berhasil dipulihkan ₊˚ʚɞ');
        } catch (err) {
          showToast('Gagal memulihkan file (｡•́︿•̀｡).', 'error');
        }
      };
      reader.readAsText(file);
    }

    function exportReadableReport() {
      let text = `=== LAPORAN BELAJAR MY STUDY SPACE (${getTodayStr()}) ===\n`;
      text += `Nama: ${appState.profile.name}\n\n`;
      appState.sessions.forEach(s => {
        text += `[${s.date}] ${s.subjectName}: ${formatHMS(s.durationSec)} (${s.startTime} - ${s.endTime})\n`;
      });
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `laporan-belajar-${getTodayStr()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Laporan diekspor ✧');
    }
