    function parseLocalDate(dateStr) {
      if (!dateStr) return new Date();
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function formatDateIndo(dateStr, includeDay = true) {
      if (!dateStr) return '-';
      const d = parseLocalDate(dateStr);
      return includeDay ? `${HARI_ID[d.getDay()]} ⋆˚꩜｡ ${d.getDate()} ${BULAN_ID[d.getMonth()]} ${d.getFullYear()}` : `${d.getDate()} ${BULAN_ID[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatTimeHHMM(dateObj) {
      return `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
    }

    function formatHMS(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatHumanDuration(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      if (sec === 0) return '0 menit';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      if (h > 0 && m > 0) return `${h} jam ${m} mnt`;
      if (h > 0) return `${h} jam`;
      return `${m} menit`;
    }

    function getWeekBounds(refDateStr = getTodayStr()) {
      const d = parseLocalDate(refDateStr);
      const day = d.getDay();
      const diffToMon = day === 0 ? -6 : 1 - day;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diffToMon);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const cur = new Date(monday);
        cur.setDate(monday.getDate() + i);
        dates.push(`${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`);
      }
      return dates;
    }

    function getCurrentActiveElapsedSec() {
      const at = appState.activeTimer;
      if (!at || !at.subjectId) return 0;
      if (at.isRunning && at.sessionStartTimestamp) {
        const delta = Math.floor((Date.now() - at.sessionStartTimestamp) / 1000);
        return (at.accumulatedBeforeResumeSec || 0) + Math.max(0, delta);
      }
      return at.accumulatedBeforeResumeSec || 0;
    }

    function getCycleSecondsForSubject(subjectId) {
      const stored = Math.floor(Number((appState.subjectCycleSeconds || {})[subjectId]) || 0);
      const activeAdd = (appState.activeTimer?.subjectId === subjectId) ? getCurrentActiveElapsedSec() : 0;
      return stored + activeAdd;
    }

    function getTotalCycleSeconds() {
      let sum = 0;
      const map = appState.subjectCycleSeconds || {};
      for (const key of Object.keys(map)) {
        sum += Math.floor(Number(map[key]) || 0);
      }
      sum += getCurrentActiveElapsedSec();
      return sum;
    }

    function getRecordedSecondsByDate(dateStr) {
      return (appState.sessions || []).filter(s => s.date === dateStr).reduce((a, b) => a + (Number(b.durationSec) || 0), 0);
    }

    function getRecordedSecondsBySubject(subjectId, dateFilter = null) {
      return (appState.sessions || []).filter(s => s.subjectId === subjectId && (!dateFilter || s.date === dateFilter)).reduce((a, b) => a + (Number(b.durationSec) || 0), 0);
    }

    function getTotalTodaySeconds() {
      return getRecordedSecondsByDate(getTodayStr()) + getCurrentActiveElapsedSec();
    }

    function getTotalAllTimeSeconds() {
      return (appState.sessions || []).reduce((a, b) => a + (Number(b.durationSec) || 0), 0) + getTotalCycleSeconds();
    }

    function foldActiveTimerIntoCycle() {
      const at = appState.activeTimer;
      if (!at || !at.subjectId) return;
      const elapsed = getCurrentActiveElapsedSec();
      if (elapsed > 0) {
        if (!appState.subjectCycleSeconds) appState.subjectCycleSeconds = {};
        appState.subjectCycleSeconds[at.subjectId] = (Math.floor(Number(appState.subjectCycleSeconds[at.subjectId]) || 0)) + elapsed;
      }
      appState.activeTimer = {
        isRunning: false,
        subjectId: null,
        sessionStartTimestamp: null,
        accumulatedBeforeResumeSec: 0
      };
    }

    async function persistStateToCloudNow() {
      if (isRemoteUpdating) return;
      saveLocalSessionCache();
      if (!db || !auth || !fbModules) {
        setSyncStatus('local');

      try {
        setSyncStatus('saving');
        const user = await ensureFirebaseAuth();
        if (!user) throw new Error('Belum terautentikasi');
        const payload = JSON.parse(JSON.stringify(appState));
        await fbModules.setDoc(getUserCloudDocRef(user.uid), {
          state: payload,
          updatedAt: Date.now()

        setSyncStatus('saved');
      } catch (err) {
        setSyncStatus('local');
      }
    }

      setSyncStatus('saving');
      clearTimeout(saveDebounceTimer);
      if (immediate) {
        persistStateToCloudNow();

        saveDebounceTimer = setTimeout(() => {

        }, 450);
      }

    async function subscribeToCloudData(uid) {
      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }
      if (!db || !fbModules || !uid) return;

      hasLoadedInitialDoc = false;
      const docRef = getUserCloudDocRef(uid);

      unsubscribeSnapshot = fbModules.onSnapshot(docRef, (snap) => {
        if (!snap.exists()) {
          if (!hasLoadedInitialDoc) {
            hasLoadedInitialDoc = true;
            persistStateToCloudNow();
          }
          return;
        }

        const remoteDoc = snap.data();
        const remoteState = remoteDoc.state || remoteDoc;
        isRemoteUpdating = true;
        appState = mergeWithDefaults(remoteState);
        saveLocalSessionCache();
        isRemoteUpdating = false;

        if (!hasLoadedInitialDoc) {
          hasLoadedInitialDoc = true;
        }

        if (appState.activeTimer.isRunning && appState.activeTimer.subjectId) {
          startTimerLoop();
        } else {
          stopTimerLoop();
        }

        updateLiveTimerDisplays();

        const activeEl = document.activeElement;
        const isEditingNote = currentTab === 'catatan' && notesViewState.selectedTopicId && (activeEl?.id === 'note-editor' || activeEl?.id === 'topic-title-editor');
        if (!isEditingNote) {
          refreshCurrentView();
        }
        setSyncStatus('saved');
      }, () => {
        setSyncStatus('local');
      });
    }

    async function ensureFirebaseAuth() {
      if (!auth || !fbModules) return null;
      if (auth.currentUser) {
        firebaseUser = auth.currentUser;
        return firebaseUser;
      }
      if (authInitPromise) {
        return authInitPromise;
      }
      authInitPromise = (async () => {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            try {
              const cred = await fbModules.signInWithCustomToken(auth, __initial_auth_token);
              firebaseUser = cred.user;
              return firebaseUser;
            } catch (tokenErr) {}
          }
          const cred = await fbModules.signInAnonymously(auth);
          firebaseUser = cred.user;
          return firebaseUser;
        } finally {
          authInitPromise = null;
        }
      })();
      return authInitPromise;
    }

      switchTab('beranda');

        startTimerLoop();
      }

      runSplashSequence();

      if (!firebaseConfig) {
        setSyncStatus('local');

      try {
        const [appMod, authMod, fsMod] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
        ]);

        fbModules = {
          initializeApp: appMod.initializeApp,
          getAuth: authMod.getAuth,
          signInAnonymously: authMod.signInAnonymously,
          signInWithCustomToken: authMod.signInWithCustomToken,
          onAuthStateChanged: authMod.onAuthStateChanged,
          getFirestore: fsMod.getFirestore,
          doc: fsMod.doc,
          getDoc: fsMod.getDoc,
          setDoc: fsMod.setDoc,
          onSnapshot: fsMod.onSnapshot
        };

        app = fbModules.initializeApp(firebaseConfig);
        auth = fbModules.getAuth(app);
        db = fbModules.getFirestore(app);

        const user = await ensureFirebaseAuth();
        if (user) {
          subscribeToCloudData(user.uid);
        } else {
          setSyncStatus('local');
        }
      } catch (err) {
        fbModules = null;
        app = null;
        auth = null;
        db = null;
        setSyncStatus('local');
      }
    }

    function detectQuestionType(text) {
      const t = (text || '').toLowerCase();
      if (/pilihan\s*ganda\s*kompleks|pg\s*kompleks|\bpgk\b/.test(t)) return 'Pilihan Ganda Kompleks';
      if (/benar\s*[\/-]?\s*salah|\bb\s*\/\s*s\b/.test(t)) return 'Benar Salah';
      if (/\buraian\b|\besai\b|\bessay\b/.test(t)) return 'Uraian';
      if (/isian\s*singkat|\bisian\b/.test(t)) return 'Isian';
      if (/\bmenjodohkan\b/.test(t)) return 'Menjodohkan';
      if (/pilihan\s*ganda|\bpg\b/.test(t)) return 'Pilihan Ganda';
      return '';
    }

    function parseKisiKisiTextLocally(rawText) {
      if (!rawText || !rawText.trim()) return [];

      // Normalisasi teks: pisahkan otomatis jika beberapa "Nomor Soal" menyatu dalam satu paragraf panjang
      const normalizedText = rawText
        .replace(/\r\n/g, '\n')
        .replace(/([^\n])\s+(?=(?:\d+\.\s*)?Nomor\s*Soal\s*:?\s*\d+)/gi, '$1\n')
        .replace(/([^\n])\s+(?=[A-Z]\.\s+[A-Z0-9\s,&\-()]{4,}(?:\n|$))/g, '$1\n');

      const lines = normalizedText.split('\n').map(l => l.trim()).filter(Boolean);
      const parsed = [];
      let autoNum = 1;
      let currentSection = '';
      let currentItem = null;

      const pushCurrent = () => {
        if (currentItem && (currentItem.indicator || currentItem.variant)) {
          if (!currentItem.indicator && currentItem.variant) {
            currentItem.indicator = currentItem.variant;
            currentItem.variant = '';
          }
          parsed.push({
            id: 'kk_item_' + Date.now() + '_' + autoNum + '_' + Math.random().toString(36).slice(2, 5),
            section: (currentItem.section || '').trim(),
            number: (currentItem.number || String(autoNum)).trim(),
            questionType: (currentItem.questionType || 'Pilihan Ganda').trim(),
            variant: (currentItem.variant || '').trim(),
            indicator: (currentItem.indicator || '').trim(),
            done: false
          });
          autoNum++;
        }
        currentItem = null;
      };

      for (const line of lines) {
        // Lewati judul dokumen utama atau header kolom tabel
        if (/^KISI[-\s]*KISI\b/i.test(line)) continue;
        if (/^(no\.?|nomor)\s*(soal)?\s*[\t|;,]/i.test(line) && /indikator/i.test(line)) continue;

        // Deteksi Bab / Sub-bagian besar seperti "A. BARISAN DAN DERET" atau "BAB 1 ..."
        if (/^([A-Z]\.\s+[A-Z0-9\s,&\-()]{3,}|BAB\s+[IVX0-9]+.*)$/.test(line) && !/Nomor\s*Soal|Bentuk\s*Soal|Varian\s*Soal|Indikator/i.test(line)) {
          pushCurrent();
          currentSection = line;
          continue;
        }

        // Pola 1: Format berlabel eksplisit (Nomor Soal / Bentuk Soal / Varian Soal / Indikator Soal)
        const hasStructuredLabels = /(Bentuk\s*Soal|Varian\s*Soal|Indikator\s*Soal|Indikator)\s*:/i.test(line);
        const numPrefixMatch = line.match(/^(?:\d+\.\s*)?(?:Nomor|No\.?)\s*Soal\s*:?\s*(\d+(?:\s*[-–]\s*\d+)?)\b(.*)$/i);

        if (numPrefixMatch || (hasStructuredLabels && /^\d+[.)]\s*/.test(line))) {
          pushCurrent();
          let rest = line;
          let numVal = String(autoNum);

          if (numPrefixMatch) {
            numVal = numPrefixMatch[1].replace(/\s+/g, '');
            rest = numPrefixMatch[2].trim();
          } else {
            const mLead = line.match(/^(\d+(?:\s*[-–]\s*\d+)?)[.)]\s*(.+)$/);
            if (mLead) {
              numVal = mLead[1].replace(/\s+/g, '');
              rest = mLead[2].trim();
            }
          }

          let qType = detectQuestionType(rest) || 'Pilihan Ganda';
          let variantVal = '';
          let indicatorVal = '';

          const bMatch = rest.match(/Bentuk\s*Soal\s*:\s*(.*?)(?=(?:Varian\s*Soal|Varian|Indikator\s*Soal|Indikator)\s*:|$)/i);
          if (bMatch && bMatch[1].trim()) {
            qType = bMatch[1].trim().replace(/[.;]+$/, '');
          }

          const vMatch = rest.match(/(?:Varian\s*Soal|Varian|Materi)\s*:\s*(.*?)(?=(?:Bentuk\s*Soal|Indikator\s*Soal|Indikator)\s*:|$)/i);
          if (vMatch && vMatch[1].trim()) {
            variantVal = vMatch[1].trim();
          }

          const iMatch = rest.match(/(?:Indikator\s*Soal|Indikator)\s*:\s*(.*?)(?=(?:Bentuk\s*Soal|Varian\s*Soal|Varian)\s*:|$)/i);
          if (iMatch && iMatch[1].trim()) {
            indicatorVal = iMatch[1].trim();
          }

          if (!bMatch && !vMatch && !iMatch && rest) {
            indicatorVal = rest;
          }

          currentItem = {
            section: currentSection,
            number: numVal,
            questionType: qType,
            variant: variantVal,
            indicator: indicatorVal
          };
          continue;
        }

        // Pola 2: Kelanjutan baris dari item sebelumnya (multi-baris)
        if (currentItem) {
          if (/^Bentuk\s*Soal\s*:/i.test(line)) {
            currentItem.questionType = line.replace(/^Bentuk\s*Soal\s*:\s*/i, '').trim().replace(/[.;]+$/, '') || currentItem.questionType;
            continue;
          }
          if (/^(?:Varian\s*Soal|Varian|Materi)\s*:/i.test(line)) {
            currentItem.variant = line.replace(/^(?:Varian\s*Soal|Varian|Materi)\s*:\s*/i, '').trim();
            continue;
          }
          if (/^(?:Indikator\s*Soal|Indikator)\s*:/i.test(line)) {
            currentItem.indicator = line.replace(/^(?:Indikator\s*Soal|Indikator)\s*:\s*/i, '').trim();
            continue;
          }
          if (!/^\d+[.)]\s*/.test(line)) {
            if (currentItem.indicator) currentItem.indicator += ' ' + line;
            else if (currentItem.variant) currentItem.variant += ' ' + line;
            continue;
          }
        }

        // Pola 3: Format kolom tabel (Tab, |, ;) atau daftar bernomor biasa ("1. ...")
        pushCurrent();
        let questionType = detectQuestionType(line) || 'Pilihan Ganda';
        const cols = line.split(/\t|\s*\|\s*|\s*;\s*/).map(c => c.trim()).filter(Boolean);
        let numStr = '';
        let variantStr = '';
        let indicatorStr = '';

        if (cols.length >= 4) {
          numStr = /^\d+/.test(cols[0]) ? cols[0] : String(autoNum);
          const colType = detectQuestionType(cols[1]) || detectQuestionType(cols[cols.length - 1]);
          if (colType) questionType = colType;
          if (detectQuestionType(cols[1])) {
            variantStr = cols[2];
            indicatorStr = cols[3];
          } else {
            variantStr = cols[1];
            indicatorStr = cols[2];
          }
        } else if (cols.length === 3) {
          numStr = /^\d+/.test(cols[0]) ? cols[0] : String(autoNum);
          const lastIsType = detectQuestionType(cols[2]);
          if (lastIsType) {
            indicatorStr = cols[1];
            questionType = lastIsType;
          } else {
            variantStr = cols[1];
            indicatorStr = cols[2];
          }
        } else if (cols.length === 2) {
          if (/^\d+(\s*[-–]\s*\d+)?$/.test(cols[0])) {
            numStr = cols[0];
            indicatorStr = cols[1];
          } else {
            numStr = String(autoNum);
            indicatorStr = cols[0];
            const t2 = detectQuestionType(cols[1]);
            if (t2) questionType = t2;
          }
        } else {
          const m = line.match(/^(\d+(?:\s*[-–]\s*\d+)?)[.)\]:\-\s]+(.+)$/);
          if (m) {
            numStr = m[1].replace(/\s+/g, '');
            indicatorStr = m[2].trim();
          } else {
            numStr = String(autoNum);
            indicatorStr = line;
          }
        }

        indicatorStr = indicatorStr
          .replace(/[\(\[\-–]\s*(pilihan\s*ganda\s*kompleks|pilihan\s*ganda|pg\s*kompleks|pgk|pg|benar\s*\/?\s*salah|uraian|esai|essay|isian\s*singkat|isian|menjodohkan)\s*[\)\]]?\s*$/i, '')
          .trim();

        if (indicatorStr) {
          parsed.push({
            id: 'kk_item_' + Date.now() + '_' + autoNum + '_' + Math.random().toString(36).slice(2, 5),
            section: currentSection,
            number: numStr || String(autoNum),
            questionType,
            variant: variantStr,
            indicator: indicatorStr,
            done: false
          });
          autoNum++;
        }
      }

      pushCurrent();
      return parsed;
    }

    function confirmResetStudyCycle() {
      const totalCycle = getTotalCycleSeconds();
      if (totalCycle <= 0) {
        showToast('Timer belajar masih 00:00:00, belum ada yang perlu di-reset ⋆˚꩜｡', 'error');
        return;
      }
      openModal(`

            Total waktu belajar aktifmu (<strong>${formatHumanDuration(totalCycle)}</strong>) akan otomatis disimpan ke <strong>Riwayat Sesi Belajar</strong> beserta tanggal & harinya, lalu timer di-reset kembali ke <strong>00:00:00</strong>.
          </p>
          <div class="flex justify-center gap-2 pt-2">

        </div>

    function executeResetStudyCycle() {
      foldActiveTimerIntoCycle();
      const now = new Date();
      const todayStr = getTodayStr();
      const dayName = HARI_ID[now.getDay()];
      let savedCount = 0;

      if (appState.subjectCycleSeconds) {
        const entries = Object.entries(appState.subjectCycleSeconds);
        for (const [subjId, sec] of entries) {
          const durationSec = Math.floor(Number(sec) || 0);
          if (durationSec > 0) {
            const subj = appState.subjects.find(s => s.id === subjId);
            const startObj = new Date(now.getTime() - durationSec * 1000);
            appState.sessions.unshift({
              id: 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
              subjectId: subjId,
              subjectName: subj ? subj.name : 'Mata Pelajaran',
              date: todayStr,
              dayName: dayName,
              startTime: formatTimeHHMM(startObj),
              endTime: formatTimeHHMM(now),
              durationSec: durationSec
            });
            savedCount++;
          }
        }
      }

      appState.subjectCycleSeconds = {};
      appState.activeTimer = {
        isRunning: false,
        subjectId: null,
        sessionStartTimestamp: null,
        accumulatedBeforeResumeSec: 0
      };

      saveState(true);
      stopTimerLoop();
      closeModal();
      updateLiveTimerDisplays();
      if (currentTab === 'timer') renderTimerView();
      if (currentTab === 'beranda') renderHomeView();
      showToast(`${savedCount} catatan sesi belajar masuk ke Riwayat & timer di-reset ke 00:00:00! ₊˚ʚɞ`);
    }

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => updateLiveTimerDisplays(), 250);
    }

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLiveTimerDisplays() {
      const at = appState.activeTimer;
      const liveSessionSec = getCurrentActiveElapsedSec();
      const cycleTotalSec = getTotalCycleSeconds();
      const todayTotalSec = getTotalTodaySeconds();

      const headerPill = document.getElementById('header-live-timer');
      const headerText = document.getElementById('header-live-timer-text');
      if (headerPill && headerText) {
        if (at.isRunning && at.subjectId) {
          headerPill.classList.remove('hidden');
          headerPill.classList.add('flex');
          headerText.textContent = formatHMS(liveSessionSec);
        } else {
          headerPill.classList.add('hidden');
          headerPill.classList.remove('flex');
        }
      }

      const mainClock = document.getElementById('main-stopwatch-display');
      if (mainClock) {
        const mode = mainClock.dataset.mode || 'cycle';
        mainClock.textContent = formatHMS(mode === 'cycle' ? cycleTotalSec : getTotalAllTimeSeconds());
      }

      appState.subjects.forEach(subj => {
        const el = document.getElementById(`subj-timer-${subj.id}`);
        if (el) {
          el.textContent = formatHMS(getCycleSecondsForSubject(subj.id));
        }
      });

      const homeTodayEl = document.getElementById('home-today-study-time');
      if (homeTodayEl) homeTodayEl.textContent = formatHMS(todayTotalSec);
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-pink-md text-xs sm:text-sm font-bold flex items-center gap-2.5 bg-pinkbrand-600 text-white border-pinkbrand-300 transform transition-all duration-300 translate-y-[-10px] opacity-0`;
      toast.innerHTML = `
        <i data-lucide="${type === 'error' ? 'alert-circle' : 'heart'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      safeRefreshIcons(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-8px]');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function openModal(innerHtml, maxWidthClass = 'max-w-lg') {
      const root = document.getElementById('modal-root');
      const card = document.getElementById('modal-card');
      card.className = `bg-white w-full ${maxWidthClass} max-h-[88vh] overflow-y-auto rounded-3xl border-2 border-pinkbrand-200 shadow-pink-lg p-5 sm:p-6 relative`;
      card.innerHTML = innerHtml;
      root.classList.remove('hidden');
      root.classList.add('flex');
      safeRefreshIcons(card);
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
    }

    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.nav === tab;
        if (isActive) {
          btn.className = 'nav-btn flex flex-col items-center justify-center py-1.5 px-1 rounded-2xl bg-pinkbrand-100 text-pinkbrand-600 shadow-xs transition-all scale-105';

      refreshCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleKisiKisiFileSelected(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      pendingKisiFileName = file.name;
      pendingKisiFileMime = file.type || '';
      const labelEl = document.getElementById('kk-file-label');
      if (labelEl) labelEl.textContent = file.name;

      // Jika file teks/CSV, langsung baca isinya ke kotak teks tanpa butuh API key
      if (file.type === 'text/plain' || file.type === 'text/csv' || /\.(txt|csv)$/i.test(file.name)) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const box = document.getElementById('kk-raw-text');
          if (box) {
            box.value = evt.target.result || '';
            previewLiveKisiKisiParse();
          }
          pendingKisiFileBase64 = '';
          showToast('Teks dari file berhasil dimuat! ✧');
        };
        reader.readAsText(file);
        return;
      }

      // Jika foto atau PDF, siapkan base64 untuk Gemini API
      const reader = new FileReader();
      reader.onload = function(evt) {
        const dataUrl = evt.target.result || '';
        const commaIdx = dataUrl.indexOf(',');
        pendingKisiFileBase64 = commaIdx !== -1 ? dataUrl.slice(commaIdx + 1) : '';
      };
      reader.readAsDataURL(file);
    }

    async function extractKisiKisiWithGemini(apiKey, rawText, fileBase64, fileMime) {
      const parts = [
        {
          text: `Ekstrak semua daftar kisi-kisi ujian dari dokumen/teks berikut menjadi JSON array murni tanpa markdown atau penjelasan tambahan. Salin persis sesuai teks aslinya (jangan meringkas atau mengubah redaksi kalimat indikator maupun varian soal).
Format setiap objek wajib:
{"section": "nama bab/bagian persis seperti di dokumen (misal A. BARISAN DAN DERET), atau string kosong", "number": "nomor soal (misal 1 atau 1-3)", "questionType": "bentuk soal persis (misal Pilihan Ganda, Pilihan Ganda Kompleks, Benar Salah, Isian, atau Uraian)", "variant": "varian soal persis seperti di dokumen jika ada", "indicator": "bunyi indikator soal persis seperti di dokumen"}
${rawText ? '\nTeks tambahan:\n' + rawText : ''}`
        }
      ];

      if (fileBase64 && fileMime) {
        parts.push({
          inline_data: {
            mime_type: fileMime,
            data: fileBase64
          }
        });
      }

      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts }],
          generationConfig: {
            responseMimeType: 'application/json'
          }
        })
      });

      if (!resp.ok) {
        throw new Error('Gagal menghubungi AI. Periksa API Key atau koneksi internetmu.');
      }

      const json = await resp.json();
      const textOut = json?.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
      const cleaned = textOut.replace(/```json|```/gi, '').trim();
      const arr = JSON.parse(cleaned);
      if (!Array.isArray(arr)) throw new Error('Format respons AI tidak sesuai');

      return arr.map((row, idx) => ({
        id: 'kk_ai_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).slice(2, 5),
        section: String(row.section || '').trim(),
        number: String(row.number || (idx + 1)),
        questionType: String(row.questionType || 'Pilihan Ganda').trim(),
        variant: String(row.variant || '').trim(),
        indicator: String(row.indicator || '').trim(),
        done: false
      })).filter(x => x.indicator);
    }

    async function processKisiKisiImport(e, existingSetId) {
      e.preventDefault();
      const rawText = (document.getElementById('kk-raw-text')?.value || '').trim();
      const apiKey = (appState.profile?.geminiApiKey || '').trim();
      const loadingEl = document.getElementById('kk-import-loading');

      if (!rawText && !pendingKisiFileBase64) {
        showToast('Tempel teks kisi-kisi atau pilih file terlebih dahulu ya ⋆˚꩜｡', 'error');
        return;
      }

      if (pendingKisiFileBase64 && !apiKey) {
        showToast('Untuk membaca Foto/PDF otomatis, pasang Gemini API Key dulu ya—atau copy-paste teksnya langsung di kotak bawah (gratis tanpa API Key)!', 'error');
        return;
      }

      let extractedItems = [];
      try {
        if (loadingEl) {
          loadingEl.classList.remove('hidden');
          loadingEl.classList.add('flex');
        }

        if (apiKey && (pendingKisiFileBase64 || rawText)) {
          extractedItems = await extractKisiKisiWithGemini(apiKey, rawText, pendingKisiFileBase64, pendingKisiFileMime);
        } else {
          extractedItems = parseKisiKisiTextLocally(rawText);
        }
      } catch (err) {
        if (rawText) {
          extractedItems = parseKisiKisiTextLocally(rawText);
        } else {
          if (loadingEl) loadingEl.classList.add('hidden');
          showToast(err.message || 'Gagal memproses file kisi-kisi.', 'error');
          return;
        }
      } finally {
        if (loadingEl) loadingEl.classList.add('hidden');
      }

      if (extractedItems.length === 0) {
        showToast('Tidak ada indikator soal yang terbaca. Coba periksa format teksnya.', 'error');
        return;
      }

      if (!Array.isArray(appState.kisiKisiSets)) appState.kisiKisiSets = [];

      if (existingSetId) {
        const targetSet = appState.kisiKisiSets.find(s => s.id === existingSetId);
        if (targetSet) {
          targetSet.items.push(...extractedItems);
          kisiKisiViewState.selectedSetId = targetSet.id;
        }
      } else {
        const subjectName = (document.getElementById('kk-subj-input')?.value || '').trim() || 'Mata Pelajaran';
        const examTitle = (document.getElementById('kk-exam-input')?.value || '').trim() || 'Ujian';
        const newSet = {
          id: 'kk_set_' + Date.now(),
          subjectName,
          examTitle,
          createdAt: getTodayStr(),
          items: extractedItems
        };
        appState.kisiKisiSets.unshift(newSet);
        kisiKisiViewState.selectedSetId = newSet.id;
      }

      saveState(true);
      closeModal();
      renderKisiKisiView();
      showToast(`${extractedItems.length} nomor soal kisi-kisi berhasil disalin! ₊˚ʚɞ`);
    }

      const variant = document.getElementById('kki-var').value.trim();
      const indicator = document.getElementById('kki-ind').value.trim();
      if (!indicator) return;

      if (itemId) {
        const idx = setObj.items.findIndex(i => i.id === itemId);
        if (idx !== -1) setObj.items[idx] = { ...setObj.items[idx], section, number, questionType, variant, indicator };
      } else {
        setObj.items.push({
          id: 'kk_item_' + Date.now(),
          section,
          number: number || String(setObj.items.length + 1),
          questionType,
          variant,
          indicator,
          done: false

      saveState(true);
      closeModal();
      renderKisiKisiView();
      showToast('Detail soal kisi-kisi disimpan ✧');

    /*************************************************************************
     * LEARNING EVALUATOR & USER REFLECTION ENGINE
     *************************************************************************/
    function analyzeActualLearningData() {
      const todayStr = getTodayStr();
      const weekDates = getWeekBounds(todayStr);
      const prevRef = parseLocalDate(weekDates[0]);
      prevRef.setDate(prevRef.getDate() - 7);
      const prevWeekDates = getWeekBounds(`${prevRef.getFullYear()}-${String(prevRef.getMonth() + 1).padStart(2, '0')}-${String(prevRef.getDate()).padStart(2, '0')}`);

      const sessions = Array.isArray(appState.sessions) ? appState.sessions : [];
      const activeCycleSec = getTotalCycleSeconds();
      const allRecordedSec = sessions.reduce((acc, s) => acc + (Number(s.durationSec) || 0), 0);

      // 1. Konsistensi & Durasi Mingguan
      const thisWeekSessions = sessions.filter(s => weekDates.includes(s.date));
      const prevWeekSessions = sessions.filter(s => prevWeekDates.includes(s.date));
      const thisWeekSec = thisWeekSessions.reduce((a, b) => a + (Number(b.durationSec) || 0), 0) + activeCycleSec;
      const prevWeekSec = prevWeekSessions.reduce((a, b) => a + (Number(b.durationSec) || 0), 0);

      const studyDaysThisWeek = new Set(thisWeekSessions.map(s => s.date));
      if (activeCycleSec > 0) studyDaysThisWeek.add(todayStr);

      const dailyTargetSec = (appState.goals?.dailyMinutes || 120) * 60;
      const weeklyTargetSec = (appState.goals?.weeklyMinutes || 840) * 60;
      const todaySec = getTotalTodaySeconds();
      const streak = calculateStudyStreak();

      // 2. Distribusi Waktu per Mata Pelajaran (dari riwayat sesi + siklus aktif)
      const subjectTimeMap = {};
      appState.subjects.forEach(s => { subjectTimeMap[s.name] = 0; });
      sessions.forEach(s => {
        const name = s.subjectName || 'Lainnya';
        subjectTimeMap[name] = (subjectTimeMap[name] || 0) + (Number(s.durationSec) || 0);
      });
      appState.subjects.forEach(s => {
        const cyc = getCycleSecondsForSubject(s.id);
        if (cyc > 0) subjectTimeMap[s.name] = (subjectTimeMap[s.name] || 0) + cyc;
      });

      const subjectEntries = Object.entries(subjectTimeMap)
        .map(([name, sec]) => ({ name, sec }))
        .sort((a, b) => b.sec - a.sec);

      const studiedSubjects = subjectEntries.filter(x => x.sec > 0);
      const neglectedSubjects = subjectEntries.filter(x => x.sec === 0).map(x => x.name);
      const totalTrackedSec = studiedSubjects.reduce((a, b) => a + b.sec, 0);

      // 3. Spaced Repetition & Catatan
      const reviews = Array.isArray(appState.spacedReviews) ? appState.spacedReviews : [];
      const completedReviews = reviews.filter(r => r.completed);
      const overdueReviews = reviews.filter(r => !r.completed && r.dueDate < todayStr);
      const dueTodayReviews = reviews.filter(r => !r.completed && r.dueDate === todayStr);
      const topicsCount = (appState.topics || []).length;

      // 4. Error Log (Pola Kesalahan)
      const errorLogs = Array.isArray(appState.errorLogs) ? appState.errorLogs : [];
      const masteredErrors = errorLogs.filter(e => e.mastered);
      const unmasteredErrors = errorLogs.filter(e => !e.mastered);
      const reasonCounts = {};
      errorLogs.forEach(e => {
        const r = e.reason || 'Lainnya';
        reasonCounts[r] = (reasonCounts[r] || 0) + 1;
      });
      const topErrorReason = Object.entries(reasonCounts).sort((a, b) => b[1] - a[1])[0] || null;

      // 5. Perkembangan Nilai (Grades)
      const grades = Array.isArray(appState.grades) ? appState.grades : [];
      const gradesBySubject = {};
      grades.forEach(g => {
        const name = (g.subjectName || '').trim();
        if (!name) return;
        if (!gradesBySubject[name]) gradesBySubject[name] = [];
        gradesBySubject[name].push(g);
      });

      const subjectGradeTrends = Object.entries(gradesBySubject).map(([name, list]) => {
        const sorted = [...list].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const avg = Number(calcAverageScore(sorted));
        let delta = null;
        if (sorted.length >= 2) {
          delta = Number((Number(sorted[sorted.length - 1].score) - Number(sorted[0].score)).toFixed(2));
        }
        return { name, count: sorted.length, avg, delta, latestScore: sorted[sorted.length - 1].score };
      });

      // 6. Jadwal & Aktivitas Kalender
      const events = Array.isArray(appState.events) ? appState.events : [];
      const completedEvents = events.filter(ev => ev.completed);
      const upcomingExams = events
        .filter(ev => !ev.completed && ev.date >= todayStr && ev.categoryId === 'cat_exam')
        .sort((a, b) => a.date.localeCompare(b.date));

      // 7. Refleksi Pengguna Terbaru
      const reflections = Array.isArray(appState.reflections) ? appState.reflections : [];
      const latestReflection = reflections[0] || null;

      return {
        todayStr,
        sessionsCount: sessions.length,
        activeCycleSec,
        allRecordedSec,
        thisWeekSec,
        prevWeekSec,
        studyDaysThisWeekCount: studyDaysThisWeek.size,
        dailyTargetSec,
        weeklyTargetSec,
        todaySec,
        streak,
        studiedSubjects,
        neglectedSubjects,
        totalTrackedSec,
        reviewsTotal: reviews.length,
        completedReviewsCount: completedReviews.length,
        overdueReviewsCount: overdueReviews.length,
        dueTodayReviewsCount: dueTodayReviews.length,
        topicsCount,
        errorLogsTotal: errorLogs.length,
        masteredErrorsCount: masteredErrors.length,
        unmasteredErrorsCount: unmasteredErrors.length,
        topErrorReason,
        gradesTotal: grades.length,
        subjectGradeTrends,
        completedEventsCount: completedEvents.length,
        upcomingExams,
        reflectionsCount: reflections.length,
        latestReflection
      };
    }

    function buildStructuredEvaluationReport(d) {
      // 1. LEARNING OVERVIEW
      const overviewFacts = [];
      if (d.totalTrackedSec > 0) {
        overviewFacts.push(`Pada minggu berjalan tercatat total waktu belajar ${formatHumanDuration(d.thisWeekSec)} yang tersebar di ${d.studyDaysThisWeekCount} hari aktif${d.streak > 0 ? ` dengan streak ${d.streak} hari berturut-turut` : ''}.`);
      } else {
        overviewFacts.push(`Belum ada durasi belajar yang tercatat pada timer atau riwayat sesi minggu ini.`);
      }

      if (d.topicsCount > 0 || d.gradesTotal > 0 || d.errorLogsTotal > 0) {
        const parts = [];
        if (d.topicsCount > 0) parts.push(`${d.topicsCount} catatan materi`);
        if (d.gradesTotal > 0) parts.push(`${d.gradesTotal} entri nilai`);
        if (d.errorLogsTotal > 0) parts.push(`${d.errorLogsTotal} evaluasi soal salah`);
        overviewFacts.push(`Aktivitas akademik lain yang terekam meliputi ${parts.join(', ')}.`);
      } else {
        overviewFacts.push(`Data catatan materi, nilai akademik, dan log kesalahan latihan masih kosong sehingga analisis efektivitas dan tren nilai masih terbatas.`);
      }

      // 2. WHAT WENT WELL
      const wentWell = [];
      if (d.todaySec >= d.dailyTargetSec && d.dailyTargetSec > 0) {
        wentWell.push(`Target belajar harian (${formatHumanDuration(d.dailyTargetSec)}) berhasil tercapai hari ini dengan total ${formatHumanDuration(d.todaySec)}.`);
      }
      if (d.thisWeekSec >= d.weeklyTargetSec && d.weeklyTargetSec > 0) {
        wentWell.push(`Target mingguan (${formatHumanDuration(d.weeklyTargetSec)}) sudah terpenuhi.`);
      }
      if (d.streak >= 2) {
        wentWell.push(`Konsistensi harian terjaga melalui streak belajar selama ${d.streak} hari berturut-turut.`);
      }
      if (d.completedReviewsCount > 0) {
        wentWell.push(`Pengulangan materi aktif berjalan: ${d.completedReviewsCount} dari ${d.reviewsTotal} jadwal spaced repetition telah diselesaikan.`);
      }
      if (d.masteredErrorsCount > 0) {
        wentWell.push(`Proses perbaikan kesalahan terlihat dari ${d.masteredErrorsCount} soal di Error Log yang sudah ditandai paham.`);
      }
      const improvingGrades = d.subjectGradeTrends.filter(t => t.delta !== null && t.delta > 0);
      if (improvingGrades.length > 0) {
        wentWell.push(`Perkembangan nilai positif teridentifikasi pada ${improvingGrades.map(g => `${g.name} (+${g.delta} poin)`).join(', ')}.`);
      }
      if (d.latestReflection && d.latestReflection.wentWell) {
        wentWell.push(`Berdasarkan refleksimu (${formatDateIndo(d.latestReflection.date, false)}), hal yang berjalan baik: "${d.latestReflection.wentWell}".`);
      }
      if (wentWell.length === 0) {
        wentWell.push(`Belum cukup data aktivitas selesai untuk menyimpulkan capaian spesifik; mulai mencatat sesi timer, review materi, atau refleksi harian akan membantu memetakan kekuatan belajarmu.`);
      }

      // 3. AREAS TO IMPROVE
      const areasToImprove = [];
      if (d.totalTrackedSec > 0 && d.studiedSubjects.length >= 2) {
        const topSubj = d.studiedSubjects[0];
        const sharePct = Math.round((topSubj.sec / d.totalTrackedSec) * 100);
        if (sharePct >= 60) {
          areasToImprove.push(`Distribusi waktu masih terpusat pada ${topSubj.name} (${sharePct}% dari total ${formatHumanDuration(d.totalTrackedSec)}), sementara mata pelajaran lain mendapat porsi jauh lebih kecil.`);
        }
      }
      if (d.neglectedSubjects.length > 0 && d.totalTrackedSec > 0) {
        areasToImprove.push(`Terdapat ${d.neglectedSubjects.length} mata pelajaran yang belum mendapatkan alokasi waktu belajar tercatat: ${d.neglectedSubjects.slice(0, 4).join(', ')}${d.neglectedSubjects.length > 4 ? ', dll.' : '.'}`);
      }
      if (d.overdueReviewsCount > 0) {
        areasToImprove.push(`Ada ${d.overdueReviewsCount} jadwal pengulangan materi (spaced repetition) yang melewati tanggal jatuh tempo, yang berisiko menurunkan retensi ingatan.`);
      }
      if (d.unmasteredErrorsCount > 0) {
        const reasonNote = d.topErrorReason ? ` dengan penyebab terbanyak "${d.topErrorReason[0]}" (${d.topErrorReason[1]} kali)` : '';
        areasToImprove.push(`Masih terdapat ${d.unmasteredErrorsCount} soal di Error Log yang belum ditandai paham${reasonNote}.`);
      }
      const decliningOrLowGrades = d.subjectGradeTrends.filter(t => (t.delta !== null && t.delta < 0) || t.avg < 75);
      if (decliningOrLowGrades.length > 0) {
        areasToImprove.push(`Perhatian akademik diperlukan pada ${decliningOrLowGrades.map(g => `${g.name} (rata-rata ${g.avg}${g.delta !== null && g.delta < 0 ? `, turun ${Math.abs(g.delta)} poin` : ''})`).join(', ')}.`);
      }
      if (d.latestReflection) {
        if (d.latestReflection.obstacles) {
          areasToImprove.push(`Hambatan yang kamu catat dalam refleksi: "${d.latestReflection.obstacles}".`);
        }
        if (d.latestReflection.difficultTopics) {
          areasToImprove.push(`Materi yang masih dirasa sulit berdasarkan refleksimu: "${d.latestReflection.difficultTopics}".`);
        }
      }
      if (areasToImprove.length === 0) {
        areasToImprove.push(`Belum ditemukan hambatan atau ketimpangan data yang signifikan; tetap lengkapi catatan evaluasi soal dan refleksi agar area perbaikan terdeteksi lebih dini.`);
      }

      // 4. LEARNING INSIGHTS
      const insights = [];
      if (d.prevWeekSec > 0 && d.thisWeekSec > 0) {
        const diffPct = Math.round(((d.thisWeekSec - d.prevWeekSec) / d.prevWeekSec) * 100);
        insights.push(`Volume durasi belajar minggu ini berubah ${diffPct >= 0 ? `+${diffPct}%` : `${diffPct}%`} dibandingkan minggu sebelumnya (${formatHumanDuration(d.prevWeekSec)} → ${formatHumanDuration(d.thisWeekSec)}).`);
      } else if (d.thisWeekSec > 0 && d.prevWeekSec === 0) {
        insights.push(`Data durasi minggu lalu belum tersedia sebagai pembanding, sehingga baseline evaluasi saat ini menggunakan ${formatHumanDuration(d.thisWeekSec)} yang tercatat minggu ini.`);
      }

      if (d.upcomingExams.length > 0) {
        const nextExam = d.upcomingExams[0];
        const examStudied = d.studiedSubjects.find(s => s.name.toLowerCase().includes(nextExam.title.toLowerCase()) || nextExam.title.toLowerCase().includes(s.name.toLowerCase()));
        if (!examStudied) {
          insights.push(`Ujian terdekat di kalender adalah ${nextExam.title} (${formatDateIndo(nextExam.date, false)}), namun mata pelajaran tersebut belum memiliki catatan durasi belajar pada siklus saat ini.`);
        } else {
          insights.push(`Ujian terdekat adalah ${nextExam.title} (${formatDateIndo(nextExam.date, false)}) dan sudah mulai dicicil selama ${formatHumanDuration(examStudied.sec)}.`);
        }
      }

      if (d.topErrorReason && d.errorLogsTotal >= 2) {
        insights.push(`Pola kesalahan paling dominan dalam latihanmu adalah "${d.topErrorReason[0]}" (${d.topErrorReason[1]} dari ${d.errorLogsTotal} kasus), menandakan evaluasi proses pengerjaan sama pentingnya dengan menambah jam belajar.`);
      }

      if (d.latestReflection && d.latestReflection.helpfulStrategies) {
        insights.push(`Strategi yang terbukti membantu menurut pengalamanmu sendiri: "${d.latestReflection.helpfulStrategies}".`);
      }

      if (insights.length === 0) {
        insights.push(`Kombinasi data timer, Error Log, nilai, dan refleksi pribadi masih minim—semakin rutin keempatnya diisi, semakin tajam pola keterkaitan antara cara belajar dan hasil nilaimu.`);
      }

      // 5. YOUR NEXT STEPS (Maksimal 3 rekomendasi konkret & terprioritas)
      const nextSteps = [];
      if (d.overdueReviewsCount > 0 || d.dueTodayReviewsCount > 0) {
        nextSteps.push(`Prioritas 1 — Selesaikan ${d.overdueReviewsCount + d.dueTodayReviewsCount} jadwal review Spaced Repetition yang jatuh tempo lewat ikon lonceng (🔔) dengan menguji ingatan inti sebelum membaca ulang catatan.`);
      }
      if (d.unmasteredErrorsCount > 0) {
        const focusReason = d.topErrorReason ? ` terutama yang disebabkan "${d.topErrorReason[0]}"` : '';
        nextSteps.push(`Kerjakan ulang tanpa melihat pembahasan untuk ${d.unmasteredErrorsCount} soal yang belum paham di tab Evaluasi${focusReason}, lalu tandai paham hanya jika langkahnya sudah lancar.`);
      }
      if (d.upcomingExams.length > 0) {
        const targetExam = d.upcomingExams[0];
        nextSteps.push(`Fokuskan sesi belajar berikutnya pada persiapan ${targetExam.title} (jadwal ujian ${formatDateIndo(targetExam.date, false)}) dengan latihan soal aktif dan ringkasan poin kunci.`);
      }
      if (nextSteps.length < 3 && d.latestReflection && d.latestReflection.toImprove) {
        nextSteps.push(`Terapkan rencana perbaikan yang kamu tulis di refleksi: "${d.latestReflection.toImprove}" pada sesi belajar terdekat.`);
      }
      if (nextSteps.length < 3 && d.totalTrackedSec === 0) {
        nextSteps.push(`Mulai gunakan Timer pada 1–2 mata pelajaran utama hari ini lalu tekan "Reset Belajar" setelah selesai agar pola durasi dan distribusimu terekam.`);
      }
      if (nextSteps.length < 3 && d.reflectionsCount === 0) {
        nextSteps.push(`Isi satu catatan refleksi singkat setelah sesi belajar berikutnya untuk merekam materi yang masih sulit dan strategi yang paling cocok untukmu.`);
      }

      // 6. EVALUATOR'S NOTE
      let evaluatorNote = '';
      if (d.totalTrackedSec > 0 || d.gradesTotal > 0 || d.errorLogsTotal > 0 || d.reflectionsCount > 0) {
        evaluatorNote = `Kualitas belajarmu ditentukan oleh seberapa sadar kamu mengevaluasi pemahaman, mengulang materi tepat waktu, dan memperbaiki pola kesalahan—bukan semata lamanya angka di timer. Gunakan temuan di atas sebagai pijakan objektif untuk menyesuaikan langkah belajarmu pada periode berikutnya.`;
      } else {
        evaluatorNote = `Saat ini ruang belajarmu masih berada di tahap awal pencatatan data. Setiap sesi singkat yang kamu ukur, kesalahan latihan yang kamu bedah, dan refleksi jujur yang kamu tulis akan membangun gambaran utuh tentang cara belajar terbaikmu sendiri.`;
      }

      return {
        overviewFacts,
        wentWell,
        areasToImprove,
        insights,
        nextSteps: nextSteps.slice(0, 3),
        evaluatorNote
      };
    }

    function addDaysToDateStr(baseDateStr, daysToAdd) {
      const d = parseLocalDate(baseDateStr);
      d.setDate(d.getDate() + daysToAdd);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function scheduleSpacedRepetitionForTopic(topic, notifyToast = false) {
      if (!topic) return;
      if (!Array.isArray(appState.spacedReviews)) appState.spacedReviews = [];
      const subj = appState.subjects.find(s => s.id === topic.subjectId);
      const subjectName = subj ? subj.name : 'Mata Pelajaran';
      const baseDate = getTodayStr();
      const intervals = [1, 3, 7, 14];

      appState.spacedReviews = appState.spacedReviews.filter(r => !(r.topicId === topic.id && !r.completed));

      intervals.forEach(days => {
        appState.spacedReviews.push({
          id: 'sr_' + Date.now() + '_' + days + '_' + Math.random().toString(36).slice(2, 5),
          topicId: topic.id,
          topicTitle: topic.title,
          subjectName,
          intervalDay: days,
          dueDate: addDaysToDateStr(baseDate, days),
          completed: false,
          completedAt: null
        });
      });

      saveState();
      updateNotificationBadge();
      if (notifyToast) {
        showToast(`Pengingat review H+1, H+3, H+7, H+14 dijadwalkan untuk "${topic.title}"! 🔔`);
      }
    }

    function getAllActionableNotifications() {
      const todayStr = getTodayStr();
      const notifications = [];

      const dueReviews = (appState.spacedReviews || []).filter(r => !r.completed && r.dueDate <= todayStr);
      dueReviews.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
      dueReviews.forEach(r => {
        const isOverdue = r.dueDate < todayStr;
        notifications.push({
          id: r.id,
          kind: 'review',
          isOverdue,
          date: r.dueDate,
          title: `Review Materi: ${r.topicTitle}`,
          subtitle: `${r.subjectName} • Siklus Hari ke-${r.intervalDay}`,
          topicId: r.topicId,
          reviewId: r.id
        });
      });

      const dueEvents = (appState.events || []).filter(ev => !ev.completed && ev.date <= todayStr);
      dueEvents.sort((a, b) => a.date.localeCompare(b.date));
      dueEvents.forEach(ev => {
        const cat = appState.categories.find(c => c.id === ev.categoryId) || { name: 'Agenda' };
        const isOverdue = ev.date < todayStr;
        notifications.push({
          id: ev.id,
          kind: 'event',
          isOverdue,
          date: ev.date,
          title: ev.title,
          subtitle: `${cat.name}${ev.startTime ? ' • ' + ev.startTime : ''}`,
          eventId: ev.id
        });
      });

      return notifications;
    }

    function updateNotificationBadge() {
      const badge = document.getElementById('header-notif-badge');
      if (!badge) return;
      const count = getAllActionableNotifications().length;
      if (count > 0) {
        badge.textContent = count > 99 ? '99+' : String(count);
        badge.classList.remove('hidden');
        badge.classList.add('inline-flex');
      } else {
        badge.classList.add('hidden');
        badge.classList.remove('inline-flex');
      }
    }

      notesViewState.selectedSubjectId = topic.subjectId;

      showToast('Selamat me-review materi! Klik "Sudah Review" jika selesai ₊˚ʚɞ');

    function markSpacedReviewDone(reviewId, reopenModal = true) {
      const rev = (appState.spacedReviews || []).find(r => r.id === reviewId);
      if (rev) {
        rev.completed = true;
        rev.completedAt = getTodayStr();
        saveState();
        updateNotificationBadge();
        showToast('Mantap! Materi sudah di-review & makin nempel di ingatan ✧');
      }
      if (reopenModal) openNotificationsModal();
    }

      toggleEventComplete(eventId);

    function handleErrorLogImageSelect(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_DIM = 760;
          let w = img.width;
          let h = img.height;
          if (w > MAX_DIM || h > MAX_DIM) {
            if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
            else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          pendingErrorLogImageDataUrl = canvas.toDataURL('image/jpeg', 0.75);
          const statusEl = document.getElementById('el-image-status');
          if (statusEl) statusEl.textContent = 'Foto siap disimpan ✧';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function parseTimeToMinutes(hhmm, fallbackMin) {
      if (!hhmm || typeof hhmm !== 'string' || !hhmm.includes(':')) return fallbackMin;
      const [h, m] = hhmm.split(':').map(Number);
      if (isNaN(h) || isNaN(m)) return fallbackMin;
      return h * 60 + m;
    }

    function formatMinutesToHHMM(totalMins) {
      const normalized = ((Math.round(totalMins) % 1440) + 1440) % 1440;
      const h = Math.floor(normalized / 60);
      const m = normalized % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function calculateSmartStudyPlan() {
      const sp = appState.smartPlanner || { startTime: '19:00', endTime: '21:30', breakMinutes: 15, items: [] };
      const startTime = sp.startTime || '19:00';
      const endTime = sp.endTime || '21:30';
      const breakMin = Math.max(0, Number(sp.breakMinutes) || 0);
      const items = Array.isArray(sp.items) ? sp.items : [];

      const startMins = parseTimeToMinutes(startTime, 19 * 60);
      let endMins = parseTimeToMinutes(endTime, 21 * 60 + 30);
      if (endMins <= startMins) {
        endMins += 24 * 60;
      }

      const grossWindowMin = Math.max(20, endMins - startMins);
      if (items.length === 0) {
        return { startTime, endTime, breakMin, grossWindowMin, totalBreakMin: 0, netStudyMin: grossWindowMin, breakCount: 0, timeline: [], plan: [] };
      }

      const diffWeight = { 'Sulit': 3, 'Sedang': 2, 'Mudah': 1 };
      const urgWeight = { 'Tinggi': 2.2, 'Sedang': 1.5, 'Rendah': 1.0 };

      const weighted = items.map(item => {
        const dw = diffWeight[item.difficulty] || 2;
        const uw = urgWeight[item.urgency] || 1.5;
        const score = dw * 1.4 + uw * 1.2;
        return { ...item, weightScore: score };
      });

      const totalWeight = weighted.reduce((acc, x) => acc + x.weightScore, 0);
      const sorted = [...weighted].sort((a, b) => b.weightScore - a.weightScore);

      // Hitung jeda antar mapel + micro-break otomatis (setiap blok fokus > 45 menit)
      const transitionBreaksCount = Math.max(0, sorted.length - 1);
      const estNetBeforeMicro = Math.max(15 * sorted.length, grossWindowMin - (transitionBreaksCount * breakMin));
      const estimatedMicroBreaks = sorted.reduce((acc, item) => {
        const estMins = Math.round((item.weightScore / totalWeight) * estNetBeforeMicro);
        return acc + (estMins > 50 ? Math.floor((estMins - 1) / 45) : 0);
      }, 0);

      const microBreakUnit = breakMin > 0 ? Math.min(10, Math.max(5, Math.round(breakMin * 0.4))) : 0;
      const desiredTotalBreak = (transitionBreaksCount * breakMin) + (estimatedMicroBreaks * microBreakUnit);
      const maxAllowableTotalBreak = Math.floor(grossWindowMin * 0.65);
      const scaleBreakRatio = desiredTotalBreak > maxAllowableTotalBreak && desiredTotalBreak > 0
        ? (maxAllowableTotalBreak / desiredTotalBreak)
        : 1;

      const effectiveTransitionBreak = Math.round(breakMin * scaleBreakRatio);
      const effectiveMicroBreak = Math.round(microBreakUnit * scaleBreakRatio);

      // Alokasikan menit bersih belajar terlebih dahulu
      const preliminaryBreakTotal = (transitionBreaksCount * effectiveTransitionBreak) + (estimatedMicroBreaks * effectiveMicroBreak);
      const netStudyMin = Math.max(10 * sorted.length, grossWindowMin - preliminaryBreakTotal);

      let allocatedSum = 0;
      const rawPlans = sorted.map((item, idx) => {
        let mins = Math.round((item.weightScore / totalWeight) * netStudyMin);
        if (idx === sorted.length - 1) {
          mins = Math.max(5, netStudyMin - allocatedSum);
        } else {
          mins = Math.max(10, mins);
          allocatedSum += mins;
        }
        return { ...item, allocatedMinutes: mins, order: idx + 1 };
      });

      // Susun timeline lengkap dengan jeda berkala (micro-break dalam sesi panjang & jeda antar mapel)
      let cursorMin = startMins;
      let actualTotalBreakMin = 0;
      let actualBreakCount = 0;
      const timeline = [];
      const plan = [];

      rawPlans.forEach((item, idx) => {
        const pct = Math.round((item.allocatedMinutes / netStudyMin) * 100);
        let tip = '';
        if (item.difficulty === 'Sulit') {
          tip = 'Kerjakan lebih dulu saat energi penuh: pahami konsep inti lalu latihan soal.';
        } else if (item.difficulty === 'Sedang') {
          tip = 'Buat rangkuman poin kunci & uji pemahaman dengan tanya-jawab mandiri.';
        } else {
          tip = 'Review cepat catatan & hafalkan kata kunci sebelum sesi berakhir.';
        }

        const itemOverallStart = formatMinutesToHHMM(cursorMin);

        // Pecah menjadi beberapa blok fokus (maks 45 mnt/blok) jika durasi > 50 mnt dan jeda aktif
        if (item.allocatedMinutes > 50 && effectiveMicroBreak > 0) {
          const chunkCount = Math.ceil(item.allocatedMinutes / 45);
          const baseChunk = Math.floor(item.allocatedMinutes / chunkCount);
          let rem = item.allocatedMinutes % chunkCount;

          for (let c = 0; c < chunkCount; c++) {
            const thisChunkMin = baseChunk + (rem > 0 ? 1 : 0);
            if (rem > 0) rem--;

            const cStart = formatMinutesToHHMM(cursorMin);
            const cEnd = formatMinutesToHHMM(cursorMin + thisChunkMin);
            cursorMin += thisChunkMin;

            timeline.push({
              type: 'study',
              ...item,
              partLabel: `Sesi ${c + 1}/${chunkCount} (${thisChunkMin} mnt)`,
              slotStart: cStart,
              slotEnd: cEnd,
              percentage: pct,
              strategyTip: tip
            });

            if (c < chunkCount - 1) {
              const mbStart = formatMinutesToHHMM(cursorMin);
              const mbEnd = formatMinutesToHHMM(cursorMin + effectiveMicroBreak);
              cursorMin += effectiveMicroBreak;
              actualTotalBreakMin += effectiveMicroBreak;
              actualBreakCount++;
              timeline.push({
                type: 'break',
                breakKind: 'micro',
                label: 'Jeda Singkat • Minum & Peregangan',
                slotStart: mbStart,
                slotEnd: mbEnd,
                durationMin: effectiveMicroBreak
              });
            }
          }
        } else {
          const sStart = formatMinutesToHHMM(cursorMin);
          const sEnd = formatMinutesToHHMM(cursorMin + item.allocatedMinutes);
          cursorMin += item.allocatedMinutes;
          timeline.push({
            type: 'study',
            ...item,
            partLabel: `${item.allocatedMinutes} mnt`,
            slotStart: sStart,
            slotEnd: sEnd,
            percentage: pct,
            strategyTip: tip
          });
        }

        const itemOverallEnd = formatMinutesToHHMM(cursorMin);
        plan.push({
          ...item,
          percentage: pct,
          slotStart: itemOverallStart,
          slotEnd: itemOverallEnd,
          strategyTip: tip
        });

        // Jeda utama antar mata pelajaran (makan / sholat / istirahat)
        if (idx < rawPlans.length - 1 && effectiveTransitionBreak > 0) {
          const brkStart = formatMinutesToHHMM(cursorMin);
          const brkEnd = formatMinutesToHHMM(cursorMin + effectiveTransitionBreak);
          cursorMin += effectiveTransitionBreak;
          actualTotalBreakMin += effectiveTransitionBreak;
          actualBreakCount++;
          timeline.push({
            type: 'break',
            breakKind: 'transition',
            label: 'Jeda Istirahat / Makan / Sholat',
            slotStart: brkStart,
            slotEnd: brkEnd,
            durationMin: effectiveTransitionBreak
          });
        }
      });

      const finalEndTime = formatMinutesToHHMM(cursorMin);
      return {
        startTime,
        endTime: finalEndTime,
        breakMin,
        grossWindowMin,
        totalBreakMin: actualTotalBreakMin,
        breakCount: actualBreakCount,
        netStudyMin,
        timeline,
        plan
      };
    }

    function importTomorrowScheduleToPlanner(tomorrowStr) {
      const events = appState.events.filter(ev => ev.date === tomorrowStr);
      if (events.length === 0) return;
      const hardKeywords = ['matematika', 'mtl', 'pm', 'fisika', 'kimia'];
      appState.smartPlanner.items = events.map((ev, idx) => {
        const lower = ev.title.toLowerCase();
        const isHard = hardKeywords.some(k => lower.includes(k));
        return {
          id: 'sp_' + Date.now() + '_' + idx,
          subjectName: ev.title,
          difficulty: isHard ? 'Sulit' : 'Sedang',
          urgency: 'Tinggi',
          done: false
        };
      });
      saveState();
      refreshCurrentView();
      showToast('Jadwal besok otomatis dimasukkan & dibagi waktunya! ⋆˚꩜｡');
    }

    function cyclePlannerDifficulty(itemId) {
      const order = ['Sulit', 'Sedang', 'Mudah'];
      const item = appState.smartPlanner?.items?.find(x => x.id === itemId);
      if (!item) return;
      item.difficulty = order[(order.indexOf(item.difficulty) + 1) % order.length];
      saveState();
      refreshCurrentView();
    }

    function cyclePlannerUrgency(itemId) {
      const order = ['Tinggi', 'Sedang', 'Rendah'];
      const item = appState.smartPlanner?.items?.find(x => x.id === itemId);
      if (!item) return;
      item.urgency = order[(order.indexOf(item.urgency) + 1) % order.length];
      saveState();
      refreshCurrentView();

    function syncSmartPlanToTodayCalendar() {
      const { plan } = calculateSmartStudyPlan();
      if (!plan || plan.length === 0) return;
      const todayStr = getTodayStr();
      let addedCount = 0;
      for (const slot of plan) {
        const title = `Belajar ${slot.subjectName}`;
        const alreadyExists = appState.events.some(ev => ev.date === todayStr && ev.title === title && ev.startTime === slot.slotStart);
        if (!alreadyExists) {
          appState.events.push({
            id: 'ev_sp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            title,
            date: todayStr,
            categoryId: 'cat_study',
            startTime: slot.slotStart,
            endTime: slot.slotEnd,
            priority: slot.urgency,
            description: `Target fokus ${slot.allocatedMinutes} menit (${slot.difficulty}). ${slot.strategyTip}`,
            completed: Boolean(slot.done)
          });
          addedCount++;
        }
      }
      saveState();
      refreshCurrentView();
      if (addedCount > 0) {
        showToast(`${addedCount} sesi belajar berhasil dimasukkan ke Kalender Hari Ini! ✿`);
      } else {
        showToast('Semua jadwal belajar ini sudah ada di Kalender Hari Ini ✧');
      }
    }

    function startTimerFromPlanner(subjectName) {
      const lower = subjectName.toLowerCase();
      let matched = appState.subjects.find(s => s.name.toLowerCase() === lower || s.name.toLowerCase().includes(lower) || lower.includes(s.name.toLowerCase()));
      if (!matched) {
        matched = { id: 'subj_' + Date.now(), name: subjectName, color: '#B66878', icon: 'book-open' };
        appState.subjects.push(matched);
        saveState();
      }
      switchTab('timer');
      startOrResumeSubjectTimer(matched.id);
    }

    const GRADE_CATEGORIES = [
      { id: 'KD', label: 'KD', badgeBg: 'bg-pinkbrand-100 text-pinkbrand-600', icon: 'file-check-2' },
      { id: 'UAS', label: 'Ujian Akhir Semester', badgeBg: 'bg-amber-100 text-amber-800', icon: 'graduation-cap' },

    function normalizeGradeCategory(cat) {
      if (cat === 'UKD' || cat === 'KD') return 'KD';
      if (cat === 'UAS') return 'UAS';
      if (cat === 'RAPORT') return 'RAPORT';
      return 'KD';
    }

    function calcAverageScore(items) {
      if (!items || items.length === 0) return null;
      const sum = items.reduce((acc, item) => acc + (Number(item.score) || 0), 0);
      return (sum / items.length).toFixed(2);
    }
