  <style>
    :root {
      --pink-600: #B66878;
      --pink-500: #C98895;
      --pink-400: #D49BA7;
      --pink-300: #DAABB5;
      --pink-200: #EFC3CA;
      --pink-100: #FCE8EC;
      --pink-50:  #FFF5F7;
      --bg-app:   #FFF8F9;
    }

    body {
      background-color: var(--bg-app);
      color: #3D242B;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--pink-50);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--pink-300);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--pink-500);
    }

    #note-editor {
      min-height: 360px;
      outline: none;
      line-height: 1.75;
      color: #3D242B;
      word-break: break-word;
    }
    #note-editor:empty:before {
      content: attr(data-placeholder);
      color: #A37A84;
      pointer-events: none;
      display: block;
    }
    #note-editor h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--pink-600);
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    #note-editor h2 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--pink-500);
      margin-top: 0.85rem;
      margin-bottom: 0.4rem;
      line-height: 1.35;
    }
    #note-editor h3 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #B66878;
      margin-top: 0.7rem;
      margin-bottom: 0.3rem;
    }
    #note-editor ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin: 0.5rem 0;
    }
    #note-editor ol {
      list-style-type: decimal;
      padding-left: 1.5rem;
      margin: 0.5rem 0;
    }
    #note-editor li {
      margin-bottom: 0.25rem;
    }
    #note-editor table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.85rem 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid var(--pink-200);
    }
    #note-editor th, #note-editor td {
      border: 1px solid var(--pink-200);
      padding: 0.55rem 0.75rem;
      min-width: 60px;
      text-align: left;
    }
    #note-editor th {
      background-color: var(--pink-100);
      font-weight: 700;
      color: var(--pink-600);
    }
    #note-editor img {
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      margin: 0.75rem 0;
      border: 2px solid var(--pink-100);
      box-shadow: 0 4px 12px rgba(182, 104, 120, 0.12);
    }
    .math-pill {
      display: inline-block;
      background: linear-gradient(135deg, var(--pink-50), var(--pink-100));
      border: 1.5px solid var(--pink-300);
      color: var(--pink-600);
      font-family: 'Courier New', monospace;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 10px;
      margin: 0 2px;
    }
    .pink-highlight {
      background-color: var(--pink-100);
      color: var(--pink-600);
      padding: 1px 6px;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>

<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-pinkbrand-200 selection:text-pinkbrand-600">

  <!-- LOADING / AUTH GATE OVERLAY -->
  <div id="auth-gate" class="fixed inset-0 z-50 bg-[#FFF8F9] flex items-center justify-center p-4 overflow-y-auto hidden">
    <div id="auth-gate-content" class="w-full max-w-md bg-white rounded-3xl border-2 border-pinkbrand-200 shadow-pink-lg p-6 sm:p-8 text-center">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-pinkbrand-500 to-pinkbrand-600 flex items-center justify-center text-white shadow-pink-md mx-auto mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="sparkles" aria-hidden="true" class="lucide lucide-sparkles w-7 h-7"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><circle cx="4" cy="20" r="2"></circle></svg>
        </div>
        <h2 class="font-display font-black text-2xl text-stone-800">My Study Space</h2>
        <p class="text-xs text-pinkbrand-500 font-semibold mt-1 mb-5">
          Simpan catatan, timer &amp; jadwal belajarmu secara permanen ⋆˚꩜｡
        </p>

        <div class="grid grid-cols-2 gap-1.5 p-1 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 mb-4">
          <button type="button" onclick="setAuthGateTab('login')" class="py-2 rounded-xl text-xs font-extrabold transition text-pinkbrand-600">
            Masuk Akun
          </button>
          <button type="button" onclick="setAuthGateTab('register')" class="py-2 rounded-xl text-xs font-extrabold transition bg-pinkbrand-600 text-white shadow-xs">
            Daftar Baru
          </button>
        </div>

        

        <form onsubmit="handleAuthGateSubmit(event)" class="space-y-3 text-left">
          
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">Nama Panggilan</label>
              <input id="auth-name-input" type="text" placeholder="Contoh: Rina, Budi..." required="" class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
            </div>
          
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">Email</label>
            <input id="auth-email-input" type="email" placeholder="nama@email.com" required="" class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">Kata Sandi (min. 4 karakter)</label>
            <input id="auth-pass-input" type="password" minlength="4" placeholder="••••••••" required="" class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">
          </div>
          <button id="auth-submit-btn" type="submit" class="w-full py-3 rounded-2xl bg-pinkbrand-600 hover:bg-pinkbrand-500 text-white font-extrabold text-sm shadow-pink-md transition active:scale-95" disabled="">Memproses...</button>
        </form>

        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-pinkbrand-200"></div></div>
          <div class="relative flex justify-center"><span class="bg-white px-3 text-[11px] font-bold text-stone-400">atau</span></div>
        </div>

        <button type="button" onclick="handleGuestLogin()" class="w-full py-2.5 rounded-2xl bg-pinkbrand-50 hover:bg-pinkbrand-100 text-pinkbrand-600 border border-pinkbrand-200 font-bold text-xs transition">
          Lanjutkan Cepat sebagai Tamu
        </button>
      </div>
  </div>

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-pinkbrand-200 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('beranda')">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-pinkbrand-500 to-pinkbrand-600 flex items-center justify-center text-white shadow-pink-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="sparkles" aria-hidden="true" class="lucide lucide-sparkles w-5 h-5"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><circle cx="4" cy="20" r="2"></circle></svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-display font-extrabold text-lg sm:text-xl leading-tight bg-gradient-to-r from-pinkbrand-600 to-pinkbrand-400 bg-clip-text text-transparent">
              My Study Space
            </h1>
            <span id="cloud-sync-pill" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-extrabold" title="Tersinkronisasi ke Cloud"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="refresh-cw" aria-hidden="true" class="lucide lucide-refresh-cw w-3 h-3 animate-spin"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg><span class="hidden md:inline">Menyimpan...</span></span>
          </div>
          <p class="text-[11px] font-medium text-pinkbrand-500 hidden sm:block">
            ⋆˚꩜｡ Ruang belajar tenang &amp; estetik ₊˚ʚɞ
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="header-live-timer" onclick="switchTab('timer')" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-full bg-pinkbrand-600 text-white text-xs font-bold shadow-pink-sm animate-pulse">
          <span class="w-2 h-2 rounded-full bg-white"></span>
          <span id="header-live-timer-text">00:00:00</span>
        </button>

        <button onclick="openGoalsModal()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-pinkbrand-50 hover:bg-pinkbrand-100 text-pinkbrand-600 border border-pinkbrand-200 text-xs sm:text-sm font-bold transition active:scale-95" title="Target Belajar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="target" aria-hidden="true" class="lucide lucide-target w-4 h-4 text-pinkbrand-500"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          <span class="hidden sm:inline">Target</span>
        </button>

        <button onclick="openAccountModal()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-pinkbrand-50 hover:bg-pinkbrand-100 text-pinkbrand-600 border border-pinkbrand-200 text-xs sm:text-sm font-bold transition active:scale-95" title="Akun &amp; Sinkronisasi">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="user-circle" aria-hidden="true" class="lucide lucide-user-circle w-4 h-4 text-pinkbrand-500"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="10" r="3"></circle><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path></svg>
          <span id="header-user-badge" class="hidden sm:inline max-w-[90px] truncate">azetkaiyea</span>
        </button>

        <button onclick="openSettingsModal()" class="p-2 rounded-xl bg-pinkbrand-50 hover:bg-pinkbrand-100 text-pinkbrand-600 border border-pinkbrand-200 transition active:scale-95" title="Pengaturan">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="settings" aria-hidden="true" class="lucide lucide-settings w-4 h-4 sm:w-5 sm:h-5 text-pinkbrand-500"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main id="app-content" class="flex-1 max-w-5xl w-full mx-auto px-4 pt-5 pb-28">
          <div class="space-y-4">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const DEFAULT_SUBJECTS = [
      { id: 'subj_fisika', name: 'Fisika', color: '#B66878', icon: 'atom' },
      { id: 'subj_biologi', name: 'Biologi', color: '#C98895', icon: 'leaf' },
      { id: 'subj_kimia', name: 'Kimia', color: '#D49BA7', icon: 'flask-conical' },
      { id: 'subj_mat_wajib', name: 'Matematika Wajib', color: '#DAABB5', icon: 'calculator' },
      { id: 'subj_mat_lanjut', name: 'Matematika Tingkat Lanjut', color: '#C98895', icon: 'sigma' },
      { id: 'subj_snbt', name: 'SNBT', color: '#B66878', icon: 'graduation-cap' }
    ];

    const DEFAULT_CATEGORIES = [
      { id: 'cat_study', name: 'Jadwal Belajar', color: '#B66878' },
      { id: 'cat_task', name: 'Tugas', color: '#C98895' },
      { id: 'cat_exam', name: 'Ujian', color: '#D49BA7' },
      { id: 'cat_deadline', name: 'Deadline', color: '#B66878' },
      { id: 'cat_personal', name: 'Aktivitas Pribadi', color: '#DAABB5' }
    ];

    function getDefaultState() {
      return {
        profile: {
          name: 'Sahabat Belajar',
          snbtDate: '2028-04-20'
        },
        subjects: JSON.parse(JSON.stringify(DEFAULT_SUBJECTS)),
        sessions: [],
        activeTimer: {
          isRunning: false,
          subjectId: null,
          sessionStartTimestamp: null,
          accumulatedBeforeResumeSec: 0
        },
        topics: [],
        events: [],
        categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
        goals: {
          dailyMinutes: 120,
          weeklyMinutes: 840,
          monthlyMinutes: 3600
        },
        quickNotes: []
      };
    }

    function mergeWithDefaults(parsed) {
      const def = getDefaultState();
      if (!parsed || typeof parsed !== 'object') return def;
      return {
        ...def,
        ...parsed,
        profile: { ...def.profile, ...(parsed.profile || {}) },
        activeTimer: { ...def.activeTimer, ...(parsed.activeTimer || {}) },
        goals: { ...def.goals, ...(parsed.goals || {}) },
        subjects: Array.isArray(parsed.subjects) && parsed.subjects.length > 0 ? parsed.subjects : def.subjects,
        categories: Array.isArray(parsed.categories) && parsed.categories.length > 0 ? parsed.categories : def.categories,
        sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
        topics: Array.isArray(parsed.topics) ? parsed.topics : [],
        events: Array.isArray(parsed.events) ? parsed.events : [],
        quickNotes: Array.isArray(parsed.quickNotes) ? parsed.quickNotes : []
      };
    }

    // Cloud Initialization
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'my-study-space-default';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

    let app = null;
    let auth = null;
    let db = null;
    let firebaseUser = null;
    let activeAccount = null; // { type: 'email' | 'guest', accountKey: string, email: string }
    let unsubscribeSnapshot = null;
    let saveDebounceTimer = null;
    let isRemoteUpdating = false;
    let hasLoadedInitialDoc = false;
    let authModeTab = 'login'; // 'login' | 'register'

    let appState = getDefaultState();
    let currentTab = 'beranda';
    let timerInterval = null;
    let timerMainMode = 'today';

    let notesViewState = { selectedSubjectId: null, selectedTopicId: null, searchQuery: '' };
    let calendarViewState = { mode: 'month', cursorDate: getTodayStr() };

    function setSyncStatus(status) {
      const pill = document.getElementById('cloud-sync-pill');
      if (!pill) return;
      if (status === 'saving') {
        pill.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 text-[10px] font-extrabold';
        pill.innerHTML = `<i data-lucide="refresh-cw" class="w-3 h-3 animate-spin"></i><span class="hidden md:inline">Menyimpan...</span>`;
      } else if (status === 'error') {
        pill.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-[10px] font-extrabold';
        pill.innerHTML = `<i data-lucide="cloud-off" class="w-3 h-3"></i><span class="hidden md:inline">Gagal Sync</span>`;
      } else {
        pill.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-extrabold';
        pill.innerHTML = `<i data-lucide="cloud-check" class="w-3 h-3"></i><span class="hidden md:inline">Tersimpan</span>`;
      }
      lucide.createIcons({ nodes: [pill] });
    }

    function normalizeEmailKey(email) {
      return email.trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
    }

    async function hashPassword(password) {
      const enc = new TextEncoder().encode(password + '::mystudyspace_salt');
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getAccountDocRef(accountKey) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'study_space_accounts', accountKey);
    }

    async function persistStateToCloudNow() {
      if (!db || !firebaseUser || !activeAccount || isRemoteUpdating) return;
      try {
        setSyncStatus('saving');
        const payload = JSON.parse(JSON.stringify(appState));
        await setDoc(getAccountDocRef(activeAccount.accountKey), {
          state: payload,
          updatedAt: Date.now()
        }, { merge: true });
        setSyncStatus('saved');
      } catch (err) {
        setSyncStatus('error');
        showToast('Gagal menyimpan ke cloud. Periksa ukuran gambar atau koneksi (｡•́︿•̀｡)', 'error');
      }
    }

    function saveState(immediate = false) {
      if (!db || !firebaseUser || !activeAccount) return;
      setSyncStatus('saving');
      clearTimeout(saveDebounceTimer);
      if (immediate) {
        persistStateToCloudNow();
      } else {
        saveDebounceTimer = setTimeout(() => {
          persistStateToCloudNow();
        }, 450);
      }
    }

    function subscribeToAccountCloudData(accountKey) {
      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }
      hasLoadedInitialDoc = false;
      const docRef = getAccountDocRef(accountKey);

      unsubscribeSnapshot = onSnapshot(docRef, (snap) => {
        if (!snap.exists()) {
          if (!hasLoadedInitialDoc) {
            hasLoadedInitialDoc = true;
            persistStateToCloudNow();
            hideAuthGate();
            refreshCurrentView();
          }
          return;
        }

        const remoteDoc = snap.data();
        const remoteState = remoteDoc.state || remoteDoc;

    async function ensureFirebaseAuth() {
      if (!auth) return null;
      if (auth.currentUser) {
        firebaseUser = auth.currentUser;
        return firebaseUser;
      }
      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        const cred = await signInWithCustomToken(auth, __initial_auth_token);
        firebaseUser = cred.user;
      } else {
        const cred = await signInAnonymously(auth);
        firebaseUser = cred.user;
      }
      return firebaseUser;
    }

    async function handleAuthGateSubmit(e) {
      e.preventDefault();
      if (!db || !auth) return;
      const email = document.getElementById('auth-email-input').value.trim().toLowerCase();
      const password = document.getElementById('auth-pass-input').value;
      const nameInput = document.getElementById('auth-name-input');
      const displayName = nameInput ? nameInput.value.trim() : '';
      const btn = document.getElementById('auth-submit-btn');

      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Memproses...';
      }

      try {
        await ensureFirebaseAuth();
        const accountKey = 'acc_' + normalizeEmailKey(email);
        const passHash = await hashPassword(password);
        const docRef = getAccountDocRef(accountKey);
        const snap = await getDoc(docRef);

        if (authModeTab === 'login') {
          if (!snap.exists()) {
            showAuthGate('Email belum terdaftar. Silakan klik tab "Daftar Baru" untuk membuat akun.');
            return;
          }
          const data = snap.data();
          if (data.passwordHash !== passHash) {
            showAuthGate('Kata sandi salah. Silakan periksa kembali kata sandimu.');
            return;
          }
          activeAccount = { type: 'email', accountKey, email };
          appState = mergeWithDefaults(data.state || data);
          updateHeaderUserBadge();
          subscribeToAccountCloudData(accountKey);
          hideAuthGate();
          switchTab('beranda');
          showToast(`Selamat datang kembali, ${appState.profile.name}! ⋆˚꩜｡`);
        } else {
          if (snap.exists()) {
            showAuthGate('Email ini sudah terdaftar. Silakan masuk melalui tab "Masuk Akun".');
            return;
          }
          const initial = getDefaultState();
          initial.profile.name = displayName || email.split('@')[0];
          await setDoc(docRef, {
            email,
            passwordHash: passHash,
            state: initial,
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
          activeAccount = { type: 'email', accountKey, email };
          appState = initial;
          updateHeaderUserBadge();
          subscribeToAccountCloudData(accountKey);
          hideAuthGate();
          switchTab('beranda');
          showToast('Akun berhasil dibuat & tersimpan permanen ₊˚ʚɞ');
        }
      } catch (err) {
        showAuthGate('Terjadi kendala koneksi ke database. Silakan coba lagi.');
      }
    }

    async function handleGuestLogin() {
      if (!db || !auth) return;
      try {
        const user = await ensureFirebaseAuth();
        const guestKey = 'guest_' + (user?.uid || crypto.randomUUID());
        const docRef = getAccountDocRef(guestKey);
        const snap = await getDoc(docRef);
        if (!snap.exists()) {
          const initial = getDefaultState();
          await setDoc(docRef, {
            isGuest: true,
            state: initial,
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
          appState = initial;
        } else {
          appState = mergeWithDefaults(snap.data().state || snap.data());
        }
        activeAccount = { type: 'guest', accountKey: guestKey, email: '' };
        updateHeaderUserBadge();
        subscribeToAccountCloudData(guestKey);
        hideAuthGate();
        switchTab('beranda');
        showToast('Masuk sebagai Tamu ✧');
      } catch (err) {
        showAuthGate('Gagal masuk mode tamu. Silakan coba lagi.');
      }
    }

    async function initCloudApp() {
      if (!firebaseConfig) {
        hideAuthGate();
        switchTab('beranda');
        return;

      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);

      onAuthStateChanged(auth, (user) => {
        firebaseUser = user;
      });

      // Selalu tampilkan form Login / Daftar terlebih dahulu agar user mengetik akunnya sendiri
      showAuthGate('');
    }

    /*************************************************************************
     * DATE & TIME UTILITIES
     *************************************************************************/
    const HARI_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseLocalDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDateIndo(dateStr, includeDay = true) {
      if (!dateStr) return '-';
      const d = parseLocalDate(dateStr);
      return includeDay ? `${HARI_ID[d.getDay()]} ⋆˚꩜｡ ${d.getDate()} ${BULAN_ID[d.getMonth()]} ${d.getFullYear()}` : `${d.getDate()} ${BULAN_ID[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatTimeHHMM(dateObj) {
      return `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
    }

    function formatHMS(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatHumanDuration(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      if (sec === 0) return '0 menit';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      if (h > 0 && m > 0) return `${h} jam ${m} mnt`;
      if (h > 0) return `${h} jam`;
      return `${m} menit`;
    }

    function getWeekBounds(refDateStr = getTodayStr()) {
      const d = parseLocalDate(refDateStr);
      const day = d.getDay();
      const diffToMon = day === 0 ? -6 : 1 - day;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diffToMon);
      const dates = [];
      for (let i = 0; i < 7; i++) {
        const cur = new Date(monday);
        cur.setDate(monday.getDate() + i);
        dates.push(`${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`);
      }
      return dates;
    }

    function getCurrentActiveElapsedSec() {
      const at = appState.activeTimer;
      if (!at.subjectId) return 0;
      if (at.isRunning && at.sessionStartTimestamp) {
        const delta = Math.floor((Date.now() - at.sessionStartTimestamp) / 1000);
        return at.accumulatedBeforeResumeSec + Math.max(0, delta);
      }
      return at.accumulatedBeforeResumeSec;
    }

    function getRecordedSecondsByDate(dateStr) {
      return appState.sessions.filter(s => s.date === dateStr).reduce((a, b) => a + b.durationSec, 0);
    }

    function getRecordedSecondsBySubject(subjectId, dateFilter = null) {
      return appState.sessions.filter(s => s.subjectId === subjectId && (!dateFilter || s.date === dateFilter)).reduce((a, b) => a + b.durationSec, 0);
    }

    function getTotalTodaySeconds() {
      return getRecordedSecondsByDate(getTodayStr()) + getCurrentActiveElapsedSec();
    }

    function getTotalAllTimeSeconds() {
      return appState.sessions.reduce((a, b) => a + b.durationSec, 0) + getCurrentActiveElapsedSec();
    }

    function startOrResumeSubjectTimer(subjectId) {
      const at = appState.activeTimer;
      if (at.subjectId && at.subjectId !== subjectId) {
        commitCurrentTimerSession(false);
      }
      appState.activeTimer.subjectId = subjectId;
      appState.activeTimer.isRunning = true;
      appState.activeTimer.sessionStartTimestamp = Date.now();
      saveState(true);
      startTimerLoop();
      updateLiveTimerDisplays();
      if (currentTab === 'timer') renderTimerView();
      const subj = appState.subjects.find(s => s.id === subjectId);
      showToast(`Yuk, mulai belajar ${subj ? subj.name : ''}! ⋆˚꩜｡`);
    }

    function pauseActiveTimer() {
      const at = appState.activeTimer;
      if (!at.isRunning) return;
      at.accumulatedBeforeResumeSec = getCurrentActiveElapsedSec();
      at.isRunning = false;
      at.sessionStartTimestamp = null;
      saveState(true);
      stopTimerLoop();
      updateLiveTimerDisplays();
      if (currentTab === 'timer') renderTimerView();
    }

    function commitCurrentTimerSession(showNotification = true) {
      const at = appState.activeTimer;
      const totalSec = getCurrentActiveElapsedSec();
      if (at.subjectId && totalSec > 0) {
        const subj = appState.subjects.find(s => s.id === at.subjectId);
        const now = new Date();
        const startObj = new Date(now.getTime() - totalSec * 1000);
        const sessionRecord = {
          id: 'sess_' + Date.now(),
          subjectId: at.subjectId,
          subjectName: subj ? subj.name : 'Mata Pelajaran',
          date: getTodayStr(),
          startTime: formatTimeHHMM(startObj),
          endTime: formatTimeHHMM(now),
          durationSec: totalSec
        };
        appState.sessions.unshift(sessionRecord);
        if (showNotification) {
          showToast(`Sesi ${sessionRecord.subjectName} (${formatHumanDuration(totalSec)}) tersimpan di cloud! ₊˚ʚɞ`);
        }
      }
      appState.activeTimer = { isRunning: false, subjectId: null, sessionStartTimestamp: null, accumulatedBeforeResumeSec: 0 };
      saveState(true);
      stopTimerLoop();
      updateLiveTimerDisplays();
      if (currentTab === 'timer') renderTimerView();
      if (currentTab === 'beranda') renderHomeView();
    }

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => updateLiveTimerDisplays(), 250);
    }

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLiveTimerDisplays() {
      const at = appState.activeTimer;
      const liveSessionSec = getCurrentActiveElapsedSec();
      const todayTotalSec = getTotalTodaySeconds();

      const headerPill = document.getElementById('header-live-timer');
      const headerText = document.getElementById('header-live-timer-text');
      if (headerPill && headerText) {
        if (at.isRunning && at.subjectId) {
          headerPill.classList.remove('hidden');
          headerPill.classList.add('flex');
          headerText.textContent = formatHMS(liveSessionSec);
        } else {
          headerPill.classList.add('hidden');
          headerPill.classList.remove('flex');
        }
      }

      const mainClock = document.getElementById('main-stopwatch-display');
      if (mainClock) {
        const mode = mainClock.dataset.mode || 'today';
        mainClock.textContent = formatHMS(mode === 'today' ? todayTotalSec : getTotalAllTimeSeconds());
      }

      appState.subjects.forEach(subj => {
        const el = document.getElementById(`subj-timer-${subj.id}`);
        if (el) {
          const baseToday = getRecordedSecondsBySubject(subj.id, getTodayStr());
          const activeAdd = (at.subjectId === subj.id) ? liveSessionSec : 0;
          el.textContent = formatHMS(baseToday + activeAdd);
        }
      });

      const homeTodayEl = document.getElementById('home-today-study-time');
      if (homeTodayEl) homeTodayEl.textContent = formatHMS(todayTotalSec);
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-pink-md text-xs sm:text-sm font-bold flex items-center gap-2.5 bg-pinkbrand-600 text-white border-pinkbrand-300 transform transition-all duration-300 translate-y-[-10px] opacity-0`;
      toast.innerHTML = `
        <i data-lucide="${type === 'error' ? 'alert-circle' : 'heart'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons({ nodes: [toast] });
      requestAnimationFrame(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-8px]');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function openModal(innerHtml, maxWidthClass = 'max-w-lg') {

      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');

      const targetStr = appState.profile.snbtDate || '2028-04-20';
      const today = parseLocalDate(getTodayStr());
      const target = parseLocalDate(targetStr);
      const diffMs = target.getTime() - today.getTime();
      const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      return {
        targetStr,
        daysLeft: diffDays,
        formattedTarget: formatDateIndo(targetStr, false)
      };
    }

    function addQuickNote(e) {
      e.preventDefault();
      const input = document.getElementById('quick-note-input');
      const text = input.value.trim();
      if (!text) return;
      appState.quickNotes.unshift({ id: 'qn_' + Date.now(), text, done: false, createdAt: Date.now() });
      saveState();
      renderHomeView();
    }

    function toggleQuickNote(id) {
      const item = appState.quickNotes.find(q => q.id === id);
      if (item) {
        item.done = !item.done;
        saveState();
        renderHomeView();
      }
    }

    function deleteQuickNote(id) {
      appState.quickNotes = appState.quickNotes.filter(q => q.id !== id);
      saveState();
      renderHomeView();
    }

    function setMainTimerMode(mode) {
      timerMainMode = mode;
      renderTimerView();
    }

    function handleMainStartClick() {
      if (appState.activeTimer.subjectId) {
        startOrResumeSubjectTimer(appState.activeTimer.subjectId);
      } else if (appState.subjects.length > 0) {
        startOrResumeSubjectTimer(appState.subjects[0].id);
      } else {
        openAddSubjectModal();
      }
    }

    function deleteSessionRecord(sessId) {
      appState.sessions = appState.sessions.filter(s => s.id !== sessId);
      saveState();
      renderTimerView();
      showToast('Riwayat sesi dihapus.');
    }

    function openAddSubjectModal() {
      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Tambah Mata Pelajaran Baru ✎</h3>

        </div>
        <form onsubmit="createNewSubject(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">Nama Mata Pelajaran</label>

          </div>
        </form>
      `);
      setTimeout(() => document.getElementById('new-subj-name')?.focus(), 50);
    }

    function createNewSubject(e) {
      e.preventDefault();
      const name = document.getElementById('new-subj-name').value.trim();
      const color = document.querySelector('input[name="subj-color"]:checked')?.value || '#B66878';
      if (!name) return;
      appState.subjects.push({ id: 'subj_' + Date.now(), name, color, icon: 'book-open' });
      saveState();
      closeModal();
      if (currentTab === 'timer') renderTimerView();
      if (currentTab === 'catatan') renderNotesView();
      showToast(`Mata pelajaran "${name}" berhasil ditambahkan ₊˚ʚɞ`);
    }

    function openRenameSubjectModal(subjId) {
      const subj = appState.subjects.find(s => s.id === subjId);
      if (!subj) return;
      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Ubah Nama Mata Pelajaran</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-pinkbrand-50 text-pinkbrand-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <form onsubmit="saveRenameSubject(event, '${subjId}')" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1.5">Nama Baru</label>
            <input id="rename-subj-input" type="text" value="${escapeHtml(subj.name)}" required class="w-full px-4 py-2.5 rounded-2xl bg-pinkbrand-50 border border-pinkbrand-200 text-sm font-semibold text-stone-800 outline-none focus:border-pinkbrand-500">

            <button type="submit" class="px-5 py-2.5 rounded-2xl bg-pinkbrand-600 text-white font-bold text-xs shadow-pink-sm">Simpan</button>
          </div>
        </form>
      `);
    }

    function saveRenameSubject(e, subjId) {
      e.preventDefault();
      const newName = document.getElementById('rename-subj-input').value.trim();
      if (!newName) return;
      const subj = appState.subjects.find(s => s.id === subjId);
      if (subj) {
        subj.name = newName;
        appState.sessions.forEach(s => { if (s.subjectId === subjId) s.subjectName = newName; });
        saveState();
        closeModal();
        if (currentTab === 'timer') renderTimerView();
        if (currentTab === 'catatan') renderNotesView();
        showToast('Nama mata pelajaran diperbarui ✧');
      }
    }

    function confirmDeleteSubject(subjId) {
      const subj = appState.subjects.find(s => s.id === subjId);
      if (!subj) return;
      openModal(`
        <div class="text-center space-y-3">
          <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
            <i data-lucide="alert-triangle" class="w-6 h-6"></i>

          <div class="flex justify-center gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>

          </div>
        </div>
      `);
    }

    function executeDeleteSubject(subjId) {
      if (appState.activeTimer.subjectId === subjId) commitCurrentTimerSession(false);
      appState.subjects = appState.subjects.filter(s => s.id !== subjId);
      appState.topics = appState.topics.filter(t => t.subjectId !== subjId);
      if (notesViewState.selectedSubjectId === subjId) {
        notesViewState.selectedSubjectId = null;
        notesViewState.selectedTopicId = null;
      }
      saveState();
      closeModal();
      if (currentTab === 'timer') renderTimerView();
      if (currentTab === 'catatan') renderNotesView();
      showToast('Mata pelajaran dihapus.');
    }

    function applyPinkHighlight() {
      const editor = document.getElementById('note-editor');
      if (!editor) return;
      editor.focus();
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        const span = document.createElement('span');
        span.className = 'pink-highlight';
        span.textContent = sel.toString();
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(span);
        handleNoteContentChange();
      } else {
        document.execCommand('foreColor', false, '#B66878');
        handleNoteContentChange();

    // Compress image automatically so cloud document stays fast and under size limits
    function handleNoteImageSelected(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_DIM = 820;
          let w = img.width;
          let h = img.height;
          if (w > MAX_DIM || h > MAX_DIM) {
            if (w > h) {
              h = Math.round((h * MAX_DIM) / w);
              w = MAX_DIM;
            } else {
              w = Math.round((w * MAX_DIM) / h);
              h = MAX_DIM;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.78);

          const imgHtml = `<img src="${compressedDataUrl}" alt="Gambar Catatan"><p><br></p>`;
          const editor = document.getElementById('note-editor');
          if (editor) {
            editor.focus();
            document.execCommand('insertHTML', false, imgHtml);
            handleNoteContentChange();
            showToast('Gambar berhasil dioptimalkan & disimpan ke cloud ⋆˚꩜｡');
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setCalendarMode(mode) {
      calendarViewState.mode = mode;
      renderCalendarView();
    }

    function navigateCalendar(dir) {
      const d = parseLocalDate(calendarViewState.cursorDate);
      if (calendarViewState.mode === 'month') d.setMonth(d.getMonth() + dir);
      else if (calendarViewState.mode === 'week') d.setDate(d.getDate() + dir * 7);
      else d.setDate(d.getDate() + dir);
      calendarViewState.cursorDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      renderCalendarView();
    }

    function renderMonthCalendarHtml(cursorStr) {
      const d = parseLocalDate(cursorStr);
      const year = d.getFullYear();
      const month = d.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startWeekday = firstDay.getDay();
      const totalDays = lastDay.getDate();
      const todayStr = getTodayStr();

      let cells = '';
      for (let i = 0; i < startWeekday; i++) {
        cells += `<div class="min-h-[68px] sm:min-h-[84px] rounded-2xl bg-pinkbrand-50/20 border border-pinkbrand-100"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = appState.events.filter(ev => ev.date === dateStr);
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === cursorStr;

        cells += `
          <div onclick="calendarViewState.cursorDate='${dateStr}'; renderCalendarView();" class="min-h-[68px] sm:min-h-[84px] p-1.5 sm:p-2 rounded-2xl border transition cursor-pointer flex flex-col justify-between ${isSelected ? 'bg-pinkbrand-100 border-pinkbrand-600' : (isToday ? 'bg-pinkbrand-50 border-pinkbrand-400' : 'bg-white border-pinkbrand-200 hover:border-pinkbrand-400')}">
            <div class="flex items-center justify-between">
              <span class="w-6 h-6 rounded-full text-xs font-extrabold flex items-center justify-center ${isToday ? 'bg-pinkbrand-600 text-white' : 'text-stone-800'}">
                ${day}
              </span>
              ${dayEvents.length > 0 ? `<span class="text-[10px] font-extrabold text-pinkbrand-600">${dayEvents.length}</span>` : ''}
            </div>
            <div class="space-y-0.5 mt-1 overflow-hidden">
              ${dayEvents.slice(0, 2).map(ev => {
                const cat = appState.categories.find(c => c.id === ev.categoryId) || { color: '#B66878' };
                return `<div class="text-[10px] font-bold px-1.5 py-0.5 rounded-md text-white truncate ${ev.completed ? 'opacity-50 line-through' : ''}" style="background:${cat.color}">${escapeHtml(ev.title)}</div>`;
              }).join('')}
            </div>
          </div>
        `;
      }

      const selectedDayEvents = appState.events.filter(ev => ev.date === cursorStr);

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-3xl p-4 sm:p-5 border border-pinkbrand-200 shadow-pink-sm">
            <h3 class="font-display font-black text-lg text-center text-pinkbrand-600 mb-4">
              ${BULAN_ID[month]} ${year} ⋆˚꩜｡
            </h3>
            <div class="grid grid-cols-7 gap-1.5 text-center mb-2">
              ${['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map(h => `<div class="text-xs font-extrabold text-stone-500">${h}</div>`).join('')}
            </div>
            <div class="grid grid-cols-7 gap-1.5">
              ${cells}
            </div>
          </div>

          <div class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm">
            <div class="flex items-center justify-between mb-3">
              <h4 class="font-display font-extrabold text-base text-stone-800">
                Agenda ${formatDateIndo(cursorStr, true)}
              </h4>
              <button onclick="openEventModal(null, '${cursorStr}')" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-pinkbrand-600 text-white">
                + Tambah
              </button>
            </div>
            ${renderEventCardsList(selectedDayEvents)}
          </div>
        </div>
      `;

    function saveCalendarEvent(e, eventId) {
      e.preventDefault();
      const data = {
        title: document.getElementById('ev-title').value.trim(),
        date: document.getElementById('ev-date').value,
        categoryId: document.getElementById('ev-cat').value,
        startTime: document.getElementById('ev-start').value,
        endTime: document.getElementById('ev-end').value,
        priority: document.getElementById('ev-prio').value,
        description: document.getElementById('ev-desc').value.trim()
      };
      if (!data.title || !data.date) return;

      if (eventId) {
        const idx = appState.events.findIndex(x => x.id === eventId);
        if (idx !== -1) appState.events[idx] = { ...appState.events[idx], ...data };
      } else {
        appState.events.push({ id: 'ev_' + Date.now(), ...data, completed: false });
      }
      saveState();
      closeModal();
      if (currentTab === 'kalender') renderCalendarView();
      if (currentTab === 'beranda') renderHomeView();
      showToast('Agenda berhasil disimpan ke cloud ✿');
    }

    function toggleEventComplete(eventId) {
      const ev = appState.events.find(e => e.id === eventId);
      if (!ev) return;
      ev.completed = !ev.completed;
      saveState();
      if (ev.completed) showToast('Kamu sudah menyelesaikan tugas ini! ₊˚ʚɞ');
      if (currentTab === 'kalender') renderCalendarView();
      if (currentTab === 'beranda') renderHomeView();
    }

    function deleteEvent(eventId) {
      appState.events = appState.events.filter(e => e.id !== eventId);
      saveState();
      if (currentTab === 'kalender') renderCalendarView();
      if (currentTab === 'beranda') renderHomeView();
      showToast('Agenda dihapus.');
    }

    /*************************************************************************
     * 5. STUDY GOALS (TARGET BELAJAR)
     *************************************************************************/
    function calculateStudyStreak() {
      const datesWithStudy = new Set(appState.sessions.filter(s => s.durationSec > 0).map(s => s.date));
      if (getCurrentActiveElapsedSec() > 0) datesWithStudy.add(getTodayStr());
      if (datesWithStudy.size === 0) return 0;

      let streak = 0;
      const d = parseLocalDate(getTodayStr());
      if (!datesWithStudy.has(getTodayStr())) d.setDate(d.getDate() - 1);
      while (true) {
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        if (datesWithStudy.has(key)) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function openGoalsModal() {
      const todayStr = getTodayStr();
      const todaySec = getTotalTodaySeconds();
      const weekDates = getWeekBounds(todayStr);
      const weekSec = appState.sessions.filter(s => weekDates.includes(s.date)).reduce((a, b) => a + b.durationSec, 0) + getCurrentActiveElapsedSec();
      const monthPrefix = todayStr.slice(0, 7);
      const monthSec = appState.sessions.filter(s => s.date.startsWith(monthPrefix)).reduce((a, b) => a + b.durationSec, 0) + getCurrentActiveElapsedSec();

      const dTarget = (appState.goals.dailyMinutes || 120) * 60;
      const wTarget = (appState.goals.weeklyMinutes || 840) * 60;
      const mTarget = (appState.goals.monthlyMinutes || 3600) * 60;

      const dPct = Math.min(100, Math.round((todaySec / dTarget) * 100));
      const wPct = Math.min(100, Math.round((weekSec / wTarget) * 100));
      const mPct = Math.min(100, Math.round((monthSec / mTarget) * 100));
      const streak = calculateStudyStreak();

      const last7Days = [];
      for (let i = 0; i < 7; i++) {
        const dt = parseLocalDate(todayStr);
        dt.setDate(dt.getDate() - i);
        const k = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        const sec = k === todayStr ? todaySec : getRecordedSecondsByDate(k);
        last7Days.push({ date: k, sec, met: sec >= dTarget && dTarget > 0 });
      }

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-xl bg-pinkbrand-100 text-pinkbrand-600 flex items-center justify-center"><i data-lucide="target" class="w-4 h-4"></i></span>
            <h3 class="font-display font-extrabold text-lg text-stone-800">Target Belajar & Streak</h3>
          </div>

        </div>

        <div class="p-4 rounded-2xl bg-gradient-to-r from-pinkbrand-600 to-pinkbrand-500 text-white mb-4 flex items-center justify-between shadow-pink-sm">
          <div>
            <span class="text-[11px] font-extrabold uppercase tracking-wider opacity-90">Study Streak Aktif</span>
            <div class="font-display font-black text-2xl mt-0.5">✦ ${streak} Hari Berturut-turut</div>
          </div>
          <span class="text-xs font-bold bg-white/20 px-3 py-1.5 rounded-xl">Konsisten ⋆˚꩜｡</span>
        </div>

        <div class="space-y-3 mb-5">
          ${[
            { label: 'Target Harian', cur: todaySec, tar: dTarget, pct: dPct },
            { label: 'Target Mingguan', cur: weekSec, tar: wTarget, pct: wPct },
            { label: 'Target Bulanan', cur: monthSec, tar: mTarget, pct: mPct }
          ].map(g => `
            <div class="p-3.5 rounded-2xl bg-pinkbrand-50/70 border border-pinkbrand-200">
              <div class="flex justify-between text-xs font-bold mb-1">
                <span class="text-stone-800">${g.label}</span>
                <span class="text-pinkbrand-600">${formatHumanDuration(g.cur)} / ${formatHumanDuration(g.tar)} (${g.pct}%)</span>
              </div>
              <div class="w-full h-2.5 rounded-full bg-pinkbrand-200/60 overflow-hidden">
                <div class="h-full rounded-full bg-pinkbrand-600 transition-all" style="width:${g.pct}%"></div>
              </div>
            </div>
          `).join('')}
        </div>

        <form onsubmit="saveStudyGoals(event)" class="p-4 rounded-2xl bg-white border border-pinkbrand-200 space-y-3 mb-4">
          <h4 class="text-xs font-extrabold uppercase tracking-wider text-pinkbrand-600">Ubah Target Durasi (Menit)</h4>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-stone-700 mb-1">Harian</label>
              <input id="goal-daily-min" type="number" min="10" max="1440" value="${appState.goals.dailyMinutes}" required class="w-full px-3 py-2 rounded-xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-bold text-stone-800">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-stone-700 mb-1">Mingguan</label>
              <input id="goal-weekly-min" type="number" min="30" max="10080" value="${appState.goals.weeklyMinutes}" required class="w-full px-3 py-2 rounded-xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-bold text-stone-800">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-stone-700 mb-1">Bulanan</label>
              <input id="goal-monthly-min" type="number" min="60" max="44640" value="${appState.goals.monthlyMinutes}" required class="w-full px-3 py-2 rounded-xl bg-pinkbrand-50 border border-pinkbrand-200 text-xs font-bold text-stone-800">
            </div>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-pinkbrand-600 hover:bg-pinkbrand-500 text-white font-bold text-xs shadow-pink-sm transition">
            Simpan Target
          </button>
        </form>

        <div>
          <h4 class="text-xs font-extrabold uppercase tracking-wider text-stone-600 mb-2">Riwayat 7 Hari Terakhir</h4>
          <div class="grid grid-cols-7 gap-1.5 text-center">
            ${last7Days.reverse().map(item => {
              const dObj = parseLocalDate(item.date);
              return `
                <div class="p-2 rounded-xl border ${item.met ? 'bg-pinkbrand-600 text-white border-pinkbrand-600' : 'bg-pinkbrand-50/50 text-stone-700 border-pinkbrand-200'}">
                  <div class="text-[10px] font-bold">${HARI_ID[dObj.getDay()].slice(0, 3)}</div>
                  <div class="text-xs font-black my-0.5">${item.met ? '✓' : dObj.getDate()}</div>
                  <div class="text-[9px] font-semibold opacity-80">${Math.round(item.sec / 60)}m</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `, 'max-w-xl');
    }

    /*************************************************************************
     * 6. WEEKLY STUDY STATISTICS (STATISTIK)
     *************************************************************************/
    function renderStatsView() {
      const main = document.getElementById('app-content');
      const todayStr = getTodayStr();
      const weekDates = getWeekBounds(todayStr);
      const prevRef = parseLocalDate(weekDates[0]);
      prevRef.setDate(prevRef.getDate() - 7);
      const prevWeekDates = getWeekBounds(`${prevRef.getFullYear()}-${String(prevRef.getMonth() + 1).padStart(2, '0')}-${String(prevRef.getDate()).padStart(2, '0')}`);

      const thisWeekSessions = appState.sessions.filter(s => weekDates.includes(s.date));
      const prevWeekSessions = appState.sessions.filter(s => prevWeekDates.includes(s.date));

      const dailyTotals = weekDates.map(d => {
        const base = thisWeekSessions.filter(s => s.date === d).reduce((a, b) => a + b.durationSec, 0);
        return d === todayStr ? base + getCurrentActiveElapsedSec() : base;
      });

      const totalThisWeekSec = dailyTotals.reduce((a, b) => a + b, 0);
      const totalPrevWeekSec = prevWeekSessions.reduce((a, b) => a + b.durationSec, 0);
      const avgDailySec = Math.round(totalThisWeekSec / 7);

      let maxDayIdx = 0;
      dailyTotals.forEach((val, idx) => { if (val > dailyTotals[maxDayIdx]) maxDayIdx = idx; });
      const mostProductiveLabel = dailyTotals[maxDayIdx] > 0 ? `${HARI_ID[parseLocalDate(weekDates[maxDayIdx]).getDay()]} (${formatHumanDuration(dailyTotals[maxDayIdx])})` : 'Belum ada data';

      let comparisonText = 'Belum ada data minggu lalu';
      if (totalPrevWeekSec > 0) {
        const diffPct = Math.round(((totalThisWeekSec - totalPrevWeekSec) / totalPrevWeekSec) * 100);
        comparisonText = diffPct >= 0 ? `+${diffPct}% dari minggu lalu ✧` : `${diffPct}% dari minggu lalu`;
      } else if (totalThisWeekSec > 0) {
        comparisonText = '100% baru minggu ini ⋆˚꩜｡';
      }

      const subjectStats = appState.subjects.map(subj => {
        const base = thisWeekSessions.filter(s => s.subjectId === subj.id).reduce((a, b) => a + b.durationSec, 0);
        const live = (appState.activeTimer.subjectId === subj.id) ? getCurrentActiveElapsedSec() : 0;
        return { ...subj, sec: base + live };
      }).sort((a, b) => b.sec - a.sec);

      const maxBarSec = Math.max(...dailyTotals, 60);

      main.innerHTML = `
        <div class="space-y-5">
          <section class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm">
            <h2 class="font-display font-black text-xl sm:text-2xl text-stone-800">Statistik Belajar Mingguan ✿</h2>
            <p class="text-xs text-stone-500 mt-0.5">
              Periode ${formatDateIndo(weekDates[0], false)} – ${formatDateIndo(weekDates[6], false)} ⋆˚꩜｡
            </p>
          </section>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="bg-white rounded-3xl p-4 border border-pinkbrand-200 shadow-pink-sm">
              <span class="text-[11px] font-bold text-pinkbrand-600 uppercase">Total Minggu Ini</span>
              <div class="font-display font-black text-xl sm:text-2xl text-stone-800 mt-1">${formatHumanDuration(totalThisWeekSec)}</div>
              <p class="text-[11px] text-stone-500 mt-1">${comparisonText}</p>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-pinkbrand-200 shadow-pink-sm">
              <span class="text-[11px] font-bold text-pinkbrand-600 uppercase">Rata-Rata Harian</span>
              <div class="font-display font-black text-xl sm:text-2xl text-stone-800 mt-1">${formatHumanDuration(avgDailySec)}</div>
              <p class="text-[11px] text-stone-500 mt-1">Per hari (Senin–Minggu)</p>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-pinkbrand-200 shadow-pink-sm">
              <span class="text-[11px] font-bold text-pinkbrand-600 uppercase">Hari Terproduktif</span>
              <div class="font-display font-extrabold text-base sm:text-lg text-stone-800 mt-1 leading-snug">${mostProductiveLabel}</div>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-pinkbrand-200 shadow-pink-sm">
              <span class="text-[11px] font-bold text-pinkbrand-600 uppercase">Sesi Selesai</span>
              <div class="font-display font-black text-xl sm:text-2xl text-stone-800 mt-1">${thisWeekSessions.length} Sesi</div>
              <p class="text-[11px] text-stone-500 mt-1">Tercatat minggu ini</p>
            </div>
          </div>

          <section class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm">
            <h3 class="font-display font-extrabold text-base text-stone-800 mb-4">Durasi Belajar per Hari</h3>
            ${totalThisWeekSec === 0 ? `
              <div class="py-10 text-center bg-pinkbrand-50/60 rounded-2xl border border-dashed border-pinkbrand-200">
                <p class="text-xs font-bold text-stone-500">Belum ada data belajar minggu ini ⋆˚꩜｡</p>
              </div>
            ` : `
              <div class="grid grid-cols-7 gap-2 sm:gap-4 items-end h-48 pt-6 px-2 bg-pinkbrand-50/40 rounded-2xl border border-pinkbrand-200">
                ${weekDates.map((dStr, idx) => {
                  const sec = dailyTotals[idx];
                  const heightPct = sec > 0 ? Math.max(8, Math.round((sec / maxBarSec) * 100)) : 3;
                  const dayLabel = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'][idx];
                  const isToday = dStr === todayStr;
                  return `
                    <div class="flex flex-col items-center justify-end h-full">
                      <span class="text-[10px] font-extrabold text-pinkbrand-600 mb-1">${sec > 0 ? Math.round(sec / 60) + 'm' : ''}</span>
                      <div class="w-full max-w-[36px] rounded-t-xl transition-all duration-500 ${sec > 0 ? 'bg-gradient-to-t from-pinkbrand-600 to-pinkbrand-400 shadow-pink-sm' : 'bg-pinkbrand-200/50'}" style="height:${heightPct}%"></div>
                      <span class="text-xs font-extrabold mt-2 pb-2 ${isToday ? 'text-pinkbrand-600 underline' : 'text-stone-600'}">${dayLabel}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>

          <section class="bg-white rounded-3xl p-5 border border-pinkbrand-200 shadow-pink-sm">
            <h3 class="font-display font-extrabold text-base text-stone-800 mb-4">Distribusi per Mata Pelajaran</h3>
            <div class="space-y-3">
              ${subjectStats.map(s => {
                const pct = totalThisWeekSec > 0 ? Math.round((s.sec / totalThisWeekSec) * 100) : 0;
                return `
                  <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                      <span class="text-stone-800">${escapeHtml(s.name)}</span>
                      <span class="text-pinkbrand-600">${formatHumanDuration(s.sec)} (${pct}%)</span>
                    </div>
                    <div class="w-full h-3 rounded-full bg-pinkbrand-50 overflow-hidden border border-pinkbrand-200">
                      <div class="h-full rounded-full transition-all duration-500" style="width:${pct}%; background:${s.color || '#B66878'}"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
      lucide.createIcons({ nodes: [main] });
    }

    function openSettingsModal() {
      openModal(`

        </div>

        <div class="space-y-5">
          <form onsubmit="saveProfileSettings(event)" class="p-4 rounded-2xl bg-pinkbrand-50/60 border border-pinkbrand-200 space-y-3">

            <div>

            </div>

              <label class="block text-xs font-bold text-stone-700 mb-1">Estimasi Tanggal SNBT</label>
              <input id="set-snbt-date" type="date" value="${appState.profile.snbtDate}" required class="w-full px-3.5 py-2 rounded-xl bg-white border border-pinkbrand-200 text-xs font-bold text-stone-800">

          </form>

          <div class="p-4 rounded-2xl bg-pinkbrand-50/60 border border-pinkbrand-200 space-y-2.5">
            <h4 class="text-xs font-extrabold uppercase tracking-wider text-pinkbrand-600">Cadangkan & Ekspor ✦</h4>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <button type="button" onclick="downloadJsonBackup()" class="px-3 py-2.5 rounded-xl bg-white hover:bg-pinkbrand-100 border border-pinkbrand-200 text-pinkbrand-600 text-xs font-bold flex items-center justify-center gap-1.5">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Backup JSON
              </button>
              <button type="button" onclick="document.getElementById('restore-json-input').click()" class="px-3 py-2.5 rounded-xl bg-white hover:bg-pinkbrand-100 border border-pinkbrand-200 text-pinkbrand-600 text-xs font-bold flex items-center justify-center gap-1.5">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i> Restore JSON
              </button>
              <button type="button" onclick="exportReadableReport()" class="px-3 py-2.5 rounded-xl bg-white hover:bg-pinkbrand-100 border border-pinkbrand-200 text-pinkbrand-600 text-xs font-bold flex items-center justify-center gap-1.5">
                <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Ekspor Laporan
              </button>
            </div>
            <input id="restore-json-input" type="file" accept=".json" class="hidden" onchange="restoreJsonBackup(event)">
          </div>

          <div class="p-4 rounded-2xl bg-rose-50/70 border border-rose-200 flex items-center justify-between gap-3">
            <div>
              <h4 class="text-xs font-extrabold text-rose-800">Reset Semua Data</h4>
              <p class="text-[11px] text-rose-700/75">Hapus seluruh catatan dan riwayat timer</p>
            </div>
            <button type="button" onclick="confirmResetAllData()" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shrink-0">
              Reset
            </button>
          </div>
        </div>
      `, 'max-w-lg');
    }

    function saveProfileSettings(e) {
      e.preventDefault();
      appState.profile.name = document.getElementById('set-profile-name').value.trim() || 'Sahabat Belajar';
      appState.profile.snbtDate = document.getElementById('set-snbt-date').value || '2028-04-20';
      saveState();
      closeModal();
      refreshCurrentView();
      showToast('Profil diperbarui ✧');
    }

    function downloadJsonBackup() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `my-study-space-backup-${getTodayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup JSON berhasil diunduh ✧');
    }

    function restoreJsonBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (!parsed || !Array.isArray(parsed.subjects)) throw new Error();
          appState = mergeWithDefaults(parsed);
          saveState(true);
          closeModal();
          switchTab('beranda');
          showToast('Data berhasil dipulihkan & disinkronkan ke cloud ₊˚ʚɞ');
        } catch (err) {
          showToast('Gagal memulihkan file (｡•́︿•̀｡).', 'error');
        }
      };
      reader.readAsText(file);
    }

    function exportReadableReport() {
      let text = `=== LAPORAN BELAJAR MY STUDY SPACE (${getTodayStr()}) ===\n`;
      text += `Nama: ${appState.profile.name}\n\n`;
      appState.sessions.forEach(s => {
        text += `[${s.date}] ${s.subjectName}: ${formatHMS(s.durationSec)} (${s.startTime} - ${s.endTime})\n`;
      });
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `laporan-belajar-${getTodayStr()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Laporan diekspor ✧');
    }

    function confirmResetAllData() {
      openModal(`
        <div class="text-center space-y-3">
          <h3 class="font-display font-extrabold text-lg text-stone-800">Reset Seluruh Data? (｡•́︿•̀｡)</h3>
          <p class="text-xs text-stone-600">Semua catatan dan riwayat akan dikembalikan ke awal.</p>
          <div class="flex justify-center gap-2 pt-2">
            <button onclick="openSettingsModal()" class="px-4 py-2.5 rounded-2xl bg-pinkbrand-50 text-pinkbrand-600 font-bold text-xs">Batal</button>
            <button onclick="executeFullReset()" class="px-5 py-2.5 rounded-2xl bg-rose-600 text-white font-bold text-xs">Ya, Reset</button>
          </div>
        </div>
      `);
    }

    function executeFullReset() {
      stopTimerLoop();
      const preservedName = appState.profile.name;
      appState = getDefaultState();
      appState.profile.name = preservedName;
      saveState(true);
      notesViewState = { selectedSubjectId: null, selectedTopicId: null, searchQuery: '' };
      closeModal();
      switchTab('beranda');
      showToast('Aplikasi direset ke awal ✧');
    }

    // Expose functions globally for inline HTML event handlers
    Object.assign(window, {

      renderCalendarView,
      setCalendarMode,

      openEventModal,

      toggleEventComplete,

      openCategoryManagerModal,
      addCustomCategory,
      saveStudyGoals,
      saveProfileSettings,
      downloadJsonBackup,
      restoreJsonBackup,
      exportReadableReport,
      confirmResetAllData,
      executeFullReset,
      setAuthGateTab,
      handleAuthGateSubmit,
      handleGuestLogin,
      handleUpgradeGuestAccount,
      handleSwitchOrLogout
    });

    window.addEventListener('DOMContentLoaded', () => {
      switchTab('beranda');
      lucide.createIcons();
      initCloudApp();
    });
  </script>
